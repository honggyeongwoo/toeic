<script>
(function(){
'use strict';
var KEY='toeic30.v1';
var $=function(s){return document.querySelector(s)};
var screen=$('#screen'), top=$('#top');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return fmt(new Date())}
function addDays(s,n){var p=s.split('-').map(Number);return fmt(new Date(p[0],p[1]-1,p[2]+n))}
function dayDiff(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((new Date(y[0],y[1]-1,y[2])-new Date(x[0],x[1]-1,x[2]))/864e5)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- state (localStorage, every access guarded) ---------- */
function DEF(){return {day:1,done:{},streak:0,last:null,wrong:{},vocab:{},seen:{},stats:{a:0,c:0},sess:null}}
var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);var d=DEF();for(var k in d)if(o[k]===undefined)o[k]=d[k];return o}}catch(e){}return DEF()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- data index ---------- */
function byId(arr){var m={};arr.forEach(function(x){m[x.id]=x});return m}
var V=byId(VOCAB),P5=byId(PART5),P2=byId(PART2),P6=byId(PART6),P7=byId(PART7);
var WEEK_START={1:1,2:8,3:15,4:22};
function weekOf(d){return d<=7?1:d<=14?2:d<=21?3:4}
function ofWeek(arr,w){return arr.filter(function(x){return x.week===w})}
function slice(arr,w,day,per){var list=ofWeek(arr,w),off=(day-WEEK_START[w])*per;return list.slice(off,off+per)}
function itemKey(it){return it.t+'|'+it.id+(it.n!==undefined?'|'+it.n:'')+(it.qi!==undefined?'|'+it.qi:'')}
function keyToItem(k){var p=k.split('|');var it={t:p[0],id:p[1]};if(p[0]==='p6')it.n=+p[2];if(p[0]==='p7')it.qi=+p[2];return it}
function validKey(k){var it=keyToItem(k);if(it.t==='v')return !!V[it.id];if(it.t==='p5')return !!P5[it.id];if(it.t==='p2')return !!P2[it.id];if(it.t==='p6')return !!(P6[it.id]&&P6[it.id].blanks[it.n-1]);if(it.t==='p7')return !!(P7[it.id]&&P7[it.id].questions[it.qi]);return false}
function p6Items(p){return p?p.blanks.map(function(b){return {t:'p6',id:p.id,n:b.n}}):[]}
function p7Items(p){return p?p.questions.map(function(q,i){return {t:'p7',id:p.id,qi:i}}):[]}
function p2Items(list){return list.map(function(x){return {t:'p2',id:x.id}})}

/* 그날의 특별 파트: W1 LC Part2, W2 Part6, W3 Part7/Part2 교대, W4 Part7→Part2→Part6 순환 */
function specialFor(day){
  var w=weekOf(day),i;
  if(w===1)return p2Items(slice(PART2,1,day,3));
  if(w===2)return p6Items(ofWeek(PART6,2)[day-8]);
  if(w===3){i=day-15;if(i%2===0)return p7Items(ofWeek(PART7,3)[i/2]);var l3=ofWeek(PART2,3),o3=((i-1)/2)*3;return p2Items(l3.slice(o3,o3+3))}
  i=day-22;var r=i%3,n=Math.floor(i/3);
  if(r===0)return p7Items(ofWeek(PART7,4)[n]);
  if(r===1){var l4=ofWeek(PART2,4),o4=n*3;return p2Items(l4.slice(o4,o4+3))}
  return p6Items(ofWeek(PART6,4)[n]);
}
function dueReview(){
  var t=today();
  return Object.keys(S.wrong).filter(function(k){return validKey(k)&&S.wrong[k].due<=t})
    .sort(function(a,b){return S.wrong[a].due<S.wrong[b].due?-1:1}).slice(0,5)
    .map(function(k){var it=keyToItem(k);it.r=1;return it});
}
function buildDay(day){
  var q=dueReview();
  VOCAB.filter(function(v){return v.day===day}).forEach(function(v){q.push({t:'v',id:v.id})});
  slice(PART5,weekOf(day),day,5).forEach(function(x){q.push({t:'p5',id:x.id})});
  return q.concat(specialFor(day));
}
/* 한 세트 더: 아직 안 본 Part5 5개 + Part2 3개 (현재 주차 우선) */
function pickUnseen(arr,w,n,t){
  var cand=arr.filter(function(x){return x.week<=w}),un=cand.filter(function(x){return !S.seen[t+'|'+x.id]});
  var cur=un.filter(function(x){return x.week===w}),rest=un.filter(function(x){return x.week!==w});
  var out=shuffle(cur).concat(shuffle(rest)).slice(0,n);
  if(out.length<n)out=out.concat(shuffle(cand.filter(function(x){return out.indexOf(x)<0})).slice(0,n-out.length));
  return out;
}
function buildBonus(day){
  var w=weekOf(day);
  var q=pickUnseen(PART5,w,5,'p5').map(function(x){return {t:'p5',id:x.id}});
  return q.concat(p2Items(pickUnseen(PART2,w,3,'p2')));
}
function phaseOf(it){return it.r?'복습':it.t==='v'?'단어':it.t==='p5'?'문법':it.t==='p2'?'듣기':'독해'}
function phases(q){var out=[];q.forEach(function(it){var p=phaseOf(it);if(out[out.length-1]!==p)out.push(p)});return out}

/* ---------- result bookkeeping (간격 반복: 1일 → 3일 → 7일, 3연속 정답 졸업) ---------- */
function markResult(it,ok){
  var k=itemKey(it),t=today();
  S.stats.a++;if(ok)S.stats.c++;
  if(it.r){var w=S.wrong[k];if(w){if(ok){w.sc=(w.sc||0)+1;if(w.sc>=3)delete S.wrong[k];else w.due=addDays(t,[3,7][w.sc-1])}else{w.sc=0;w.due=addDays(t,1)}}}
  else{S.seen[k]=1;if(!ok&&!S.wrong[k])S.wrong[k]={due:addDays(t,1),sc:0}}
  if(it.t==='v'){S.vocab[it.id]=S.vocab[it.id]||{s:0,k:0};S.vocab[it.id].s++;if(ok)S.vocab[it.id].k++}
  var ss=S.sess;if(ss){if(ok)ss.c++;else ss.w++}
  save();
}
function displayStreak(){if(!S.last)return 0;var d=dayDiff(S.last,today());return d<=1?S.streak:0}
function finishSession(){
  var ss=S.sess,t=today();
  if(!ss.bonus){
    S.done[ss.day]=t;
    if(S.last!==t){S.streak=(S.last&&dayDiff(S.last,t)===1)?S.streak+1:1;S.last=t}
    if(S.day===ss.day)S.day=ss.day+1;
  }
  ss.fin=1;save();
}

/* ---------- speech (토익식: 남/여 성우 교대, Part 2는 질문·응답 성별 다르게) ---------- */
var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
var speaking=false,VOICES={f:null,m:null,any:null,ready:false};
var FEM=/samantha|karen|moira|tessa|victoria|ava|allison|susan|zira|aria|jenny|martha|fiona|kate|serena|nicky|catherine|libby|sonia|natasha|emma|michelle|zoe|female|woman/i;
var MAL=/daniel|alex|fred|tom|aaron|arthur|gordon|rishi|david|mark|guy|ryan|james|oliver|george|william|liam|evan|reed|rocko|eddy|male|\bman\b/i;
var NOVELTY=/bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|junior|kathy|ralph|grandma|grandpa|shelley|flo|sandy/i;
var QUALITY=/natural|neural|premium|enhanced|google|samantha|daniel|karen|aaron|arthur|gordon|moira|tessa|martha/i;
function loadVoices(){
  try{
    var vs=speechSynthesis.getVoices();if(!vs.length)return;
    var en=vs.filter(function(v){return /^en[-_](US|GB|AU|CA|IE|NZ)/i.test(v.lang)&&!NOVELTY.test(v.name)});
    if(!en.length)en=vs.filter(function(v){return /^en/i.test(v.lang)});
    var score=function(v){return (QUALITY.test(v.name)?2:0)+(/^en[-_]US/i.test(v.lang)?1:0)};
    en.sort(function(a,b){return score(b)-score(a)});
    var f=en.filter(function(v){return FEM.test(v.name)}),m=en.filter(function(v){return !FEM.test(v.name)&&MAL.test(v.name)});
    VOICES.any=en[0]||null;VOICES.f=f[0]||null;VOICES.m=m[0]||null;VOICES.ready=true;
    /* 성별을 못 알아내면 목소리 2개를 그냥 나눠 쓰고, 1개뿐이면 음높이로 구분 */
    if(!VOICES.f&&!VOICES.m&&en.length>=2){VOICES.f=en[0];VOICES.m=en[1]}
  }catch(e){}
}
function stopSpeak(){if(!canSpeak)return;try{speechSynthesis.cancel()}catch(e){}speaking=false;var s=$('.spk');if(s)s.classList.remove('on')}
/* parts: [{text, g:'f'|'m'}] */
function speak(parts){
  if(!canSpeak)return;
  try{
    speechSynthesis.cancel();
    if(!VOICES.ready)loadVoices();
    var s=$('.spk');if(s)s.classList.add('on');speaking=true;
    var done=function(){speaking=false;var s2=$('.spk');if(s2)s2.classList.remove('on')};
    parts.forEach(function(p,i){
      var u=new SpeechSynthesisUtterance(p.text);u.lang='en-US';u.rate=0.95;
      var v=VOICES[p.g]||VOICES.any;if(v){u.voice=v;u.lang=v.lang}
      if(!VOICES.f||!VOICES.m||VOICES.f===VOICES.m)u.pitch=p.g==='f'?1.15:0.85;
      if(i===parts.length-1)u.onend=done;u.onerror=done;
      speechSynthesis.speak(u);
    });
  }catch(e){speaking=false}
}
if(canSpeak){try{speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}catch(e){}}
function genderOf(id){var n=parseInt(String(id).replace(/\D/g,''),10)||0;return n%2?'f':'m'}

/* ---------- rendering ---------- */
var locked=false,timer=null;
function setScreen(html){clearTimeout(timer);locked=false;stopSpeak();screen.innerHTML=html;window.scrollTo(0,0)}
function cur(){var ss=S.sess;return ss&&!ss.fin&&ss.idx<ss.q.length?ss.q[ss.idx]:null}
function header(){
  var ss=S.sess;
  if(!ss||ss.fin){top.hidden=true;return}
  top.hidden=false;
  $('#dayLabel').textContent=ss.bonus?'Day '+ss.day+' +':'Day '+ss.day;
  var ph=phases(ss.q),it=ss.q[ss.idx],curP=it?phaseOf(it):ph[ph.length-1],ci=ph.indexOf(curP);
  $('#dots').innerHTML=ph.map(function(p,i){return '<i class="'+(i<ci?'on':i===ci?'cur':'')+'"></i>'}).join('');
  $('#phaseName').textContent=curP;
  $('#cnt').textContent=ss.idx+'/'+ss.q.length;
  $('#barFill').style.width=(ss.idx/ss.q.length*100)+'%';
}
function render(){
  header();
  var ss=S.sess;
  if(!ss)return renderHome();
  if(ss.fin)return renderResult();
  if(ss.idx>=ss.q.length){finishSession();header();return renderResult()}
  var it=ss.q[ss.idx];
  if(it.t==='v')return renderVocab(it);
  if(it.t==='p5')return renderP5(it);
  if(it.t==='p2')return renderP2(it);
  if(it.t==='p6')return renderP6(it);
  if(it.t==='p7')return renderP7(it);
  next();
}
function next(){var ss=S.sess;if(!ss)return;ss.idx++;save();render()}
function calendar(){
  var t=today(),h='<div class="cal">';
  for(var d=1;d<=30;d++){var c=S.done[d]?'done':(d===S.day&&!S.done[d]?'today':'');h+='<i class="'+c+'">'+d+'</i>'}
  return h+'</div>';
}
function startDay(bonus){
  var day=Math.min(S.day,30);
  if(bonus){day=S.done[S.day]?S.day:Math.max(1,Math.min(S.day-1,30));if(S.day>30)day=30}
  var q=bonus?buildBonus(day):buildDay(day);
  S.sess={day:day,bonus:!!bonus,q:q,idx:0,c:0,w:0,date:today(),fin:0};save();render();
}
function renderHome(){
  var t=today(),st=displayStreak();
  if(S.sess&&S.sess.date!==t){S.sess=null;save()}
  var resume=S.sess&&!S.sess.fin&&S.sess.date===t;
  var doneToday=S.day>30||S.done[S.day-1]===t;
  var h='<div class="home"><h1>토익 30일 800</h1>';
  if(S.day>30&&!resume){
    h+='<p class="big">완주 🎉</p><p class="sub">30일을 다 채웠습니다. 이제 실전만 남았어요.</p>'
      +(st?'<span class="streak">🔥 '+st+'일 연속</span>':'')+calendar()
      +'<div class="actions" style="width:100%"><button class="primary" id="bonusBtn">복습 한 세트 (5분) ▶</button></div>';
  }else if(resume){
    var ss=S.sess;
    h+='<p class="big">Day '+ss.day+(ss.bonus?' +':'')+'</p><p class="sub">하던 세트가 남아 있어요 · '+ss.idx+'/'+ss.q.length+'</p>'
      +(st?'<span class="streak">🔥 '+st+'일 연속</span>':'')
      +'<div class="actions" style="width:100%"><button class="primary" id="startBtn">이어서 하기 ▶</button></div>';
  }else if(doneToday){
    h+='<p class="big">오늘 끝 ✅</p><p class="sub">Day '+(S.day-1)+' 완료 · 내일 Day '+S.day+'</p>'
      +(st?'<span class="streak">🔥 '+st+'일 연속</span>':'')+calendar()
      +'<div class="actions" style="width:100%"><button class="primary" id="bonusBtn">한 세트 더 (5분) ▶</button></div>';
  }else{
    var cont=S.day>1;
    h+='<p class="big">Day '+S.day+'</p><p class="sub">'+(cont?'이어서 · ':'')+'약 10분</p>'
      +(st?'<span class="streak">🔥 '+st+'일 연속</span>':'<span class="streak">오늘부터 시작</span>')
      +(cont?calendar():'')
      +'<div class="actions" style="width:100%"><button class="primary" id="startBtn">Day '+S.day+' 시작 ▶</button></div>';
  }
  h+='<p class="keys">Enter 시작</p></div>';
  setScreen(h);
  var b=$('#startBtn');if(b)b.onclick=function(){if(resume)render();else startDay(false)};
  var bb=$('#bonusBtn');if(bb)bb.onclick=function(){startDay(true)};
}
function renderResult(){
  var ss=S.sess,tot=ss.c+ss.w,acc=tot?Math.round(ss.c/tot*100):0,st=displayStreak();
  var finished=!ss.bonus&&ss.day===30;
  var h='<div class="home">'
    +(finished?'<p class="big">30일 완주 🎉</p><p class="sub">Day 30까지 끝. 이제 실전에서 800을 찍을 차례.</p>':'<p class="big">오늘 끝 ✅</p><p class="sub">'+(ss.bonus?'추가 세트 완료':'Day '+ss.day+' 완료')+'</p>')
    +'<div class="stats"><div><b>'+acc+'%</b><small>정답률</small></div><div><b>'+ss.w+'</b><small>오늘 틀린 것</small></div><div><b>🔥 '+st+'</b><small>연속 일</small></div></div>'
    +(ss.w?'<p class="sub">틀린 건 내일 복습에 자동으로 나와요.</p>':'<p class="sub">다 맞았어요. 내일도 이 느낌으로.</p>')
    +calendar()
    +'<div class="actions" style="width:100%"><button class="primary" id="bonusBtn">한 세트 더 (5분) ▶</button><button class="ghost" id="homeBtn">오늘은 여기까지</button></div>'
    +'<button class="small" id="resetLink">처음부터 다시</button><div id="confirmBox"></div></div>';
  setScreen(h);
  $('#bonusBtn').onclick=function(){startDay(true)};
  $('#homeBtn').onclick=function(){S.sess=null;save();render()};
  $('#resetLink').onclick=function(){
    $('#confirmBox').innerHTML='<div class="confirm"><span>모든 진행(Day, 연속 기록, 오답)을 지우고 Day 1부터 다시 시작할까요?</span><div class="pair"><button class="no" id="cNo">취소</button><button class="yes" id="cYes">네, 초기화</button></div></div>';
    $('#cNo').onclick=function(){$('#confirmBox').innerHTML=''};
    $('#cYes').onclick=function(){S=DEF();try{localStorage.removeItem(KEY)}catch(e){}save();render()};
  };
}

/* 보기 버튼 공통 */
function choicesHtml(ch,hide){return '<div class="choices">'+ch.map(function(c,i){return '<button class="choice'+(hide?' hiddenText':'')+'" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'</b><span>'+(hide?'(들어보세요)':esc(c))+'</span></button>'}).join('')+'</div>'}
function expHtml(exp,ok){var m=/^핵심:\s*(.*?)\s*이유:\s*(.*)$/.exec(exp);var core=m?m[1]:exp,why=m?m[2]:'';return '<div class="exp'+(ok?' good':'')+'"><div><span class="lbl">핵심</span>'+esc(core)+'</div>'+(why?'<div><span class="lbl">이유</span>'+esc(why)+'</div>':'')+'</div>'}
function bindChoices(it,answer,exp,ch,after){
  var btns=screen.querySelectorAll('.choice');
  btns.forEach(function(b){b.onclick=function(){
    if(locked)return;locked=true;
    var i=+b.dataset.i,ok=i===answer;
    btns.forEach(function(x,j){x.disabled=true;if(ch)x.querySelector('span').textContent=ch[j];if(j===answer)x.classList.add('ok');else if(j===i)x.classList.add('bad');else x.classList.add('dim')});
    b.classList.add('pick');
    try{if(navigator.vibrate)navigator.vibrate(ok?12:[40,40,40])}catch(e){}
    markResult(it,ok);header();
    if(after)after(ok);
    if(ok){timer=setTimeout(next,600)}
    else{
      var box=$('#feedback');box.innerHTML=expHtml(exp,false)+'<div class="actions stick"><button class="primary" id="nextBtn">다음 ▶</button></div>';
      $('#nextBtn').onclick=next;$('#nextBtn').focus();
    }
  }});
}
function renderVocab(it){
  var v=V[it.id],flipped=false;
  var g=genderOf(v.id);
  setScreen('<span class="tag'+(it.r?' review':'')+'">'+(it.r?'복습 · 단어':'단어')+'</span>'
    +'<div class="card" id="card">'+(canSpeak?'<button class="spk mini" id="spk" aria-label="다시 듣기">🔊</button>':'')+'<div class="w">'+esc(v.word)+'</div><div class="pos">'+esc(v.pos)+'</div><div id="back" hidden><div class="m">'+esc(v.meaning)+'</div><div class="ex">'+exHl(v.ex,v.word)+'</div></div><div class="tap" id="tap">카드를 누르면 뜻이 보여요</div></div>'
    +'<div class="pair" id="pair"><button class="no" data-k="no">몰라요</button><button class="yes" data-k="yes">알아요</button></div><div id="feedback"></div><p class="keys">1 몰라요 · 2 알아요 · Space 듣기 · Enter 뜻 보기/다음</p>');
  var card=$('#card');
  var sayWord=function(){speak([{text:v.word,g:g}])},sayAll=function(){speak([{text:v.word,g:g},{text:v.ex,g:g}])};
  function flip(){if(flipped)return;flipped=true;card.classList.add('flip');$('#back').hidden=false;$('#tap').hidden=true;speak([{text:v.ex,g:g}])}
  card.onclick=flip;
  var sp=$('#spk');if(sp)sp.onclick=function(e){e.stopPropagation();if(flipped)sayAll();else sayWord()};
  screen._space=function(){if(flipped)sayAll();else sayWord()};
  if(canSpeak)timer=setTimeout(sayWord,150);
  screen.querySelectorAll('#pair button').forEach(function(b){b.onclick=function(){
    if(locked)return;locked=true;var ok=b.dataset.k==='yes';flip();
    $('#pair').hidden=true;markResult(it,ok);header();
    if(ok){card.style.borderColor='var(--ok-line)';timer=setTimeout(next,canSpeak?1600:900)}
    else{card.style.borderColor='var(--bad-line)';$('#feedback').innerHTML='<div class="actions stick"><button class="primary" id="nextBtn">다음 ▶</button></div>';$('#nextBtn').onclick=next;$('#nextBtn').focus()}
  }});
  screen._enter=function(){if(!flipped)flip();else if($('#nextBtn'))$('#nextBtn').click()};
}
function exHl(ex,word){var re=new RegExp('('+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split(' ')[0].slice(0,Math.max(4,word.split(' ')[0].length-2))+'\\w*)','i');return esc(ex).replace(re,'<em>$1</em>')}
function renderP5(it){
  var q=P5[it.id];
  setScreen('<span class="tag'+(it.r?' review':'')+'">'+(it.r?'복습 · ':'')+'Part 5 · '+esc(q.type)+'</span>'
    +'<p class="q">'+esc(q.q).replace('------','<span class="blank">______</span>')+'</p>'
    +choicesHtml(q.choices)+'<div id="feedback"></div><p class="keys">1~4 선택 · Enter 다음</p>');
  bindChoices(it,q.answer,q.exp);
}
function renderP2(it){
  var q=P2[it.id],hide=canSpeak;
  setScreen('<span class="tag'+(it.r?' review':'')+'">'+(it.r?'복습 · ':'')+'LC Part 2 · '+esc(q.trap)+'</span>'
    +'<div class="lc"><button class="spk" id="spk" aria-label="듣기">🔊</button><div class="note">'+(hide?'질문과 (A)(B)(C)를 듣고 알맞은 응답을 고르세요':'이 기기는 음성 재생이 안 돼요. 텍스트로 풀어요.')+'</div>'
    +(hide?'':'<p class="q" style="text-align:center">'+esc(q.q)+'</p>')+'</div>'
    +choicesHtml(q.choices,hide)+'<div id="feedback"></div><p class="keys">1~3 선택 · Space 다시 듣기 · Enter 다음</p>');
  var g1=genderOf(q.id),g2=g1==='f'?'m':'f';
  var parts=[{text:q.q,g:g1},{text:'A. '+q.choices[0],g:g2},{text:'B. '+q.choices[1],g:g2},{text:'C. '+q.choices[2],g:g2}];
  $('#spk').onclick=function(){speak(parts)};
  screen._space=function(){speak(parts)};
  bindChoices(it,q.answer,q.exp,hide?q.choices:null,function(){var f=$('#feedback');var s='<p class="hint">Q. '+esc(q.q)+'</p>';f.insertAdjacentHTML('afterbegin',s)});
  if(hide)timer=setTimeout(function(){speak(parts)},250);
}
function passageHtml(p,curN){
  var t=esc(p.text).replace(/\[(\d)\]/g,function(_,n){n=+n;var b=p.blanks[n-1];if(n<curN)return '<span class="b done">'+esc(b.choices[b.answer])+'</span>';return '<span class="b'+(n===curN?' cur':'')+'">'+n+'</span>'});
  return '<div class="passage"><span class="ttl">'+esc(p.title)+'</span>'+t+'</div>';
}
function renderP6(it){
  var p=P6[it.id],b=p.blanks[it.n-1];
  setScreen('<span class="tag'+(it.r?' review':'')+'">'+(it.r?'복습 · ':'')+'Part 6 · 빈칸 '+it.n+'/3</span>'+passageHtml(p,it.n)
    +'<p class="hint">빈칸 ['+it.n+']에 알맞은 것은?</p>'+choicesHtml(b.choices)+'<div id="feedback"></div><p class="keys">1~4 선택 · Enter 다음</p>');
  bindChoices(it,b.answer,b.exp);
}
function renderP7(it){
  var p=P7[it.id],q=p.questions[it.qi];
  setScreen('<span class="tag'+(it.r?' review':'')+'">'+(it.r?'복습 · ':'')+'Part 7 · '+(it.qi+1)+'/'+p.questions.length+'</span>'
    +'<div class="passage"><span class="ttl">'+esc(p.title)+'</span>'+esc(p.text)+'</div>'
    +'<p class="q" style="font-size:18px">'+esc(q.q)+'</p>'+choicesHtml(q.choices)+'<div id="feedback"></div><p class="keys">1~4 선택 · Enter 다음</p>');
  bindChoices(it,q.answer,q.exp);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var tag=(e.target&&e.target.tagName)||'';if(/INPUT|TEXTAREA/.test(tag))return;
  if(e.key==='Enter'){
    var nb=$('#nextBtn')||$('#startBtn')||$('#bonusBtn');
    if(screen._enter&&!$('#nextBtn')){e.preventDefault();screen._enter();return}
    if(nb){e.preventDefault();nb.click()}return;
  }
  if(e.key===' '&&screen._space){e.preventDefault();screen._space();return}
  if(/^[1-4]$/.test(e.key)){
    var pair=$('#pair');if(pair&&!pair.hidden){var pb=pair.querySelectorAll('button')[+e.key-1];if(pb){pb.click();return}}
    var b=screen.querySelectorAll('.choice')[+e.key-1];if(b&&!b.disabled)b.click();
  }
});
document.addEventListener('visibilitychange',function(){if(document.hidden)stopSpeak()});

/* ---------- boot ---------- */
if(S.sess&&S.sess.date!==today()){S.sess=null;save()}
if(S.sess&&!S.sess.fin&&S.sess.q.some(function(it){return !validKey(itemKey(it))})){S.sess=null;save()}
render();
})();
</script>
</html>
