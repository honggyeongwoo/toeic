<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>토익 30일 800</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one column, max 640px, exactly one task per screen; sticky top bar = Day + phase dots + thin progress. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --fg:#171A21; --muted:#6B7280; --line:#E1E5EC;
  --accent:#2457F5; --accent-fg:#FFFFFF; --accent-soft:#E8EEFF;
  --ok:#15803D; --ok-bg:#DCFCE7; --ok-line:#86EFAC;
  --bad:#B91C1C; --bad-bg:#FEE2E2; --bad-line:#FCA5A5;
  --shadow:0 1px 2px rgba(23,26,33,.06),0 8px 24px rgba(23,26,33,.06);
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1218; --surface:#181C25; --fg:#EDEFF3; --muted:#9AA3B2; --line:#2A3040;
  --accent:#5B86FF; --accent-fg:#0F1218; --accent-soft:#1B2540;
  --ok:#4ADE80; --ok-bg:#122A1B; --ok-line:#1F6B3A;
  --bad:#F87171; --bad-bg:#3A1518; --bad-line:#7A2A2E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#181C25; --fg:#EDEFF3; --muted:#9AA3B2; --line:#2A3040;
  --accent:#5B86FF; --accent-fg:#0F1218; --accent-soft:#1B2540;
  --ok:#4ADE80; --ok-bg:#122A1B; --ok-line:#1F6B3A;
  --bad:#F87171; --bad-bg:#3A1518; --bad-line:#7A2A2E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#wrap{min-height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px}
#top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:500;color:var(--muted)}
#top .day{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
#top .phase{display:flex;align-items:center;gap:8px}
#top .dots{display:flex;gap:5px}
#top .dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:block}
#top .dots i.on{background:var(--accent);border-color:var(--accent)}
#top .dots i.cur{background:var(--accent-soft);border-color:var(--accent)}
#top .cnt{font-variant-numeric:tabular-nums}
#bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
#bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

/* screen */
#screen{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:8px}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tag.review{color:var(--muted)}
.q{font-size:20px;font-weight:500;line-height:1.55;text-wrap:pretty;margin:0}
.q .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);color:transparent;line-height:1}
.hint{color:var(--muted);font-size:14px;margin:0}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.choice{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-size:17px;line-height:1.35;transition:transform .08s ease,background .15s,border-color .15s;box-shadow:var(--shadow)}
.choice b{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}
.choice span{flex:1;min-width:0;overflow-wrap:anywhere}
.choice:active{transform:scale(.985)}
.choice[disabled]{cursor:default}
.choice.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.choice.ok b{background:var(--ok);color:#fff}
.choice.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad);animation:shake .3s ease}
.choice.bad b{background:var(--bad);color:#fff}
.choice.dim{opacity:.5}
@keyframes shake{20%{transform:translateX(-4px)}60%{transform:translateX(4px)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:none}}
.choice.ok.pick{animation:pop .3s ease}
.exp{background:var(--surface);border-left:4px solid var(--bad);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.55;box-shadow:var(--shadow)}
.exp.good{border-left-color:var(--ok)}
.exp .lbl{font-weight:700;margin-right:6px}

.primary{min-height:56px;padding:12px 20px;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:18px;width:100%;box-shadow:var(--shadow);transition:transform .08s ease}
.primary:active{transform:scale(.985)}
.ghost{min-height:52px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:16px;width:100%}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:8px}
.stick{position:sticky;bottom:0;padding-block:8px 4px;background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* flashcard */
.card{position:relative;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1.5px solid var(--line);padding:28px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;cursor:pointer;user-select:none}
.card .w{font-size:34px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.card .pos{color:var(--muted);font-size:14px}
.card .m{font-size:22px;font-weight:500;color:var(--accent)}
.card .ex{font-size:15px;color:var(--muted);line-height:1.5;text-wrap:pretty}
.card .ex em{font-style:normal;color:var(--fg);font-weight:500}
.card .tap{font-size:13px;color:var(--muted);margin-top:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .no{min-height:56px;border-radius:14px;border:1.5px solid var(--bad-line);background:var(--surface);color:var(--bad);font-weight:700;font-size:17px}
.pair .yes{min-height:56px;border-radius:14px;background:var(--ok);color:#fff;font-weight:700;font-size:17px}
.card.flip .w{font-size:26px}

/* card speaker */
.spk.mini{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:20px;display:grid;place-items:center}
.spk.mini.on{animation:pulse 1s ease-in-out infinite}
/* passages */
.passage{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:38vh;overflow-y:auto;box-shadow:var(--shadow)}
.passage .ttl{font-weight:700;display:block;margin-bottom:6px;color:var(--muted);font-size:13px;letter-spacing:.04em;white-space:normal}
.passage .b{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--line);text-align:center;color:var(--muted);font-size:13px;font-weight:700}
.passage .b.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 4px}
.passage .b.done{border-color:transparent;color:var(--ok);font-weight:500;font-size:inherit;min-width:0}

/* listening */
.lc{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px}
.lc .spk{width:92px;height:92px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:36px;display:grid;place-items:center;box-shadow:var(--shadow)}
.lc .spk.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.lc .note{font-size:14px;color:var(--muted);text-align:center}
.choice.hiddenText span{color:var(--muted);font-weight:500}

/* home / result */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:24px}
.home h1{font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin:0;text-transform:uppercase}
.home .big{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0;font-variant-numeric:tabular-nums}
.home .sub{color:var(--muted);font-size:15px;margin:0}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:100%;max-width:360px}
.cal i{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:10px;color:var(--muted);font-style:normal;font-variant-numeric:tabular-nums}
.cal i.done{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.cal i.today{border-color:var(--accent);border-width:2px;color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stats div{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stats small{color:var(--muted);font-size:12px}
.small{font-size:13px;color:var(--muted);background:none;text-decoration:underline;text-underline-offset:3px;padding:8px}
.confirm{background:var(--surface);border:1.5px solid var(--bad-line);border-radius:14px;padding:14px;width:100%;display:flex;flex-direction:column;gap:10px;font-size:15px}
.confirm .pair .no{border-color:var(--line);color:var(--fg)}
.confirm .pair .yes{background:var(--bad)}
.keys{font-size:12px;color:var(--muted);text-align:center;display:none}
@media (hover:hover) and (min-width:700px){.keys{display:block}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    <div id="bar"><i id="barFill"></i></div>

  <main id="screen"></main>
</div>

{id:"p5-034", week:1, type:"어휘", q:"The warranty does not ------ damage caused by improper installation.", choices:["contain","protect","cover","hold"], answer:2, exp:"핵심: warranty covers damage = 보증이 손상을 보장하다. 이유: 보증 범위를 뜻하는 동사는 cover."},
{id:"p5-035", week:1, type:"어휘", q:"The training session has been ------ until further notice because of the storm.", choices:["postponed","prevented","declined","retired"], answer:0, exp:"핵심: postponed until further notice = 추후 통보까지 연기. 이유: 일정 연기는 postpone."},
{id:"p5-036", week:2, type:"전치사", q:"The invoice must be paid ------ thirty days of the delivery date.", choices:["within","until","by","during"], answer:0, exp:"핵심: within + 기간 = ~이내에. 이유: thirty days라는 기간 앞이므로 within."},
{id:"p5-037", week:2, type:"전치사", q:"Mireo Consulting's office is located ------ the fifth floor of the Keller Building.", choices:["in","at","on","by"], answer:2, exp:"핵심: on the + 서수 floor. 이유: 층을 나타낼 때는 전치사 on."},
{id:"p5-038", week:2, type:"전치사", q:"The seminar on digital marketing has been rescheduled ------ next Thursday.", choices:["to","on","in","for"], answer:3, exp:"핵심: reschedule A for + 시점. 이유: 일정을 특정 날짜로 잡을 때는 for."},
{id:"p5-039", week:2, type:"전치사", q:"------ its small size, Loma Bakery supplies pastries to over forty cafés in the city.", choices:["Although","Despite","However","Even"], answer:1, exp:"핵심: 뒤에 명사구 its small size → 전치사. 이유: 양보의 전치사 Despite가 정답."},
{id:"p5-040", week:2, type:"전치사", q:"Employees may not use the loading dock ------ working hours without permission.", choices:["while","among","outside","between"], answer:2, exp:"핵심: outside working hours = 근무시간 외. 이유: 명사구 앞이며 '시간 밖'을 뜻하는 outside."},
{id:"p5-041", week:2, type:"전치사", q:"All applications must be received ------ 5:00 P.M. on June 15.", choices:["until","by","since","at"], answer:1, exp:"핵심: by + 시점 = ~까지 완료. 이유: 마감 기한을 나타내므로 by."},
{id:"p5-042", week:2, type:"전치사", q:"The company has seen a steady rise ------ online orders over the past year.", choices:["of","to","in","for"], answer:2, exp:"핵심: a rise in + 명사 = ~의 증가. 이유: 증가·감소 명사 뒤에는 in."},
{id:"p5-043", week:2, type:"전치사", q:"Please direct any questions ------ the new benefits package to the HR department.", choices:["regarding","according","due","among"], answer:0, exp:"핵심: questions regarding = ~에 관한 질문. 이유: 명사구를 바로 취하는 전치사 regarding."},
{id:"p5-044", week:2, type:"전치사", q:"The factory will remain closed ------ the end of the renovation project.", choices:["by","since","for","until"], answer:3, exp:"핵심: remain + until = ~까지 계속. 이유: 상태의 지속을 나타내므로 until."},
{id:"p5-045", week:2, type:"접속사", q:"------ the venue was fully booked, the organizers moved the event to a nearby hotel.", choices:["Because","Despite","Due to","Therefore"], answer:0, exp:"핵심: 뒤에 주어+동사 절 → 접속사. 이유: 이유를 나타내는 접속사 Because."},
{id:"p5-046", week:2, type:"접속사", q:"Please contact the help desk ------ you experience any issues with the new software.", choices:["so that","unless","in spite of","if"], answer:3, exp:"핵심: 문제가 생기면 연락하라는 조건. 이유: 조건의 접속사 if가 문맥에 맞음."},
{id:"p5-047", week:2, type:"접속사", q:"The delivery was late, ------ the client was very understanding about the delay.", choices:["so","because","for","but"], answer:3, exp:"핵심: 늦었지만 고객은 이해함 → 대조. 이유: 등위접속사 but이 적절."},
{id:"p5-048", week:2, type:"접속사", q:"------ the merger is finalized, both companies will continue operating independently.", choices:["Until","During","Despite","Otherwise"], answer:0, exp:"핵심: 절을 이끌며 '~할 때까지'. 이유: During, Despite는 전치사, Until만 접속사로 가능."},
{id:"p5-049", week:2, type:"접속사", q:"Visitors must sign in at the front desk ------ they can access the laboratory.", choices:["during","prior","before","while"], answer:2, exp:"핵심: 서명 후 출입 가능 → 시간 순서. 이유: 절을 이끄는 접속사 before."},
{id:"p5-050", week:2, type:"접속사", q:"The product launch will be postponed ------ the marketing materials are approved this week.", choices:["if","because","unless","as"], answer:2, exp:"핵심: 승인되지 않으면 연기 → unless. 이유: '~하지 않는 한'의 조건 접속사."},
{id:"p5-051", week:2, type:"접속사", q:"------ the sales figures were lower than expected, the board approved the bonus plan.", choices:["Although","Despite","Nevertheless","Because of"], answer:0, exp:"핵심: 절 앞 양보 접속사. 이유: Despite, Because of는 전치사이므로 Although."},

{id:"p5-057", week:2, type:"관계사", q:"The report ------ was submitted yesterday contains several calculation errors.", choices:["who","whose","that","what"], answer:2, exp:"핵심: 사물 선행사 + 주격 관계대명사. 이유: 주어 자리가 비었으므로 that."},

{id:"p5-100", week:3, type:"접속사", q:"The warranty is valid only ------ the product is registered within thirty days.", choices:["unless","so","or","if"], answer:3, exp:"핵심: only if = ~할 경우에만. 이유: 등록이 보증의 조건이므로 if."},

{id:"p5-103", week:3, type:"품사", q:"The ------ of the two companies created the largest retailer in the region.", choices:["merge","merged","merging","merger"], answer:3, exp:"핵심: The 뒤, of 앞 주어 명사 자리. 이유: 명사 merger가 적절."},
{id:"p5-104", week:3, type:"품사", q:"The committee will meet ------ to discuss the progress of the renovation.", choices:["weeks","weekly","week","weekend"], answer:1, exp:"핵심: 자동사 meet 뒤 부사 자리. 이유: '매주'를 뜻하는 부사 weekly."},
{id:"p5-105", week:3, type:"품사", q:"Customer feedback is ------ reviewed by the product development team.", choices:["regular","regularly","regularity","regulate"], answer:1, exp:"핵심: be동사와 과거분사 사이 부사 자리. 이유: 동사를 수식하는 부사 regularly."},
{id:"p5-106", week:4, type:"가정법/도치", q:"------ the shipment arrived on time, we would not have missed the deadline.", choices:["Had","If","Should","Were"], answer:0, exp:"핵심: 가정법 과거완료 if 생략 도치. 이유: Had + 주어 + p.p. 형태이므로 Had."},
{id:"p5-107", week:4, type:"가정법/도치", q:"Not only ------ the sales target, but the team also expanded into two new markets.", choices:["the team met","did the team meet","the team did meet","met the team"], answer:1, exp:"핵심: Not only 문두 → 도치. 이유: 조동사 did + 주어 + 동사원형 어순."},
{id:"p5-108", week:4, type:"가정법/도치", q:"------ you have any questions about the policy, please contact the HR office.", choices:["Had","Were","Should","Unless"], answer:2, exp:"핵심: If you should have의 if 생략 도치. 이유: 동사원형 have 앞이므로 Should."},
{id:"p5-109", week:4, type:"가정법/도치", q:"If Mireo Consulting ------ a larger office, it could host its own training seminars.", choices:["has","had","will have","having"], answer:1, exp:"핵심: 주절 could + 동사원형 → 가정법 과거. 이유: if절에 과거형 had."},
{id:"p5-110", week:4, type:"분사", q:"The ------ figures in the annual report were later corrected by the accounting team.", choices:["mislead","misled","misleads","misleading"], answer:3, exp:"핵심: 명사 figures 앞, 오해를 주는 수치. 이유: 능동 의미의 현재분사 misleading."},
{id:"p5-111", week:4, type:"분사", q:"------ to the rapid growth of the company, the IT department has hired five new technicians.", choices:["Responding","Responded","Response","Respond"], answer:0, exp:"핵심: 분사구문, 주어 IT department가 대응함. 이유: 자동사 respond의 능동 현재분사."},
{id:"p5-112", week:4, type:"분사", q:"All items ------ from our online store can be returned within fourteen days.", choices:["purchase","purchasing","purchases","purchased"], answer:3, exp:"핵심: 본동사 can be returned가 있음. 이유: 구매된 물품 → 수동 과거분사 purchased."},
{id:"p5-113", week:4, type:"분사", q:"The committee was ------ with the proposal and approved it without changes.", choices:["satisfy","satisfied","satisfying","satisfaction"], answer:1, exp:"핵심: be satisfied with = ~에 만족하다. 이유: 사람 주어의 감정은 과거분사."},
{id:"p5-114", week:4, type:"분사", q:"------ the merger terms, the lawyers identified several clauses that needed revision.", choices:["Review","Reviewed","Reviewing","Reviews"], answer:2, exp:"핵심: 분사구문 + 목적어 the merger terms. 이유: 목적어가 있으므로 능동 현재분사 Reviewing."},
{id:"p5-115", week:4, type:"관계사", q:"The vendor ------ bid was the lowest will be awarded the contract.", choices:["who","whose","which","whom"], answer:1, exp:"핵심: 빈칸 뒤 명사 bid → 소유격. 이유: 소유격 관계대명사 whose."},
{id:"p5-116", week:4, type:"관계사", q:"Please read the enclosed brochure, ------ describes our new line of office furniture.", choices:["that","what","whose","which"], answer:3, exp:"핵심: 콤마 뒤 계속적 용법 + 주격. 이유: that 불가, 사물 주격 which."},
{id:"p5-117", week:4, type:"관계사", q:"The period ------ sales are highest is usually the last quarter of the year.", choices:["which","where","when","what"], answer:2, exp:"핵심: 시간 선행사 period + 완전한 절. 이유: 관계부사 when."},
{id:"p5-118", week:4, type:"관계사", q:"Mr. Alvarez is the engineer ------ designed the ventilation system for the new plant.", choices:["whom","which","whose","who"], answer:3, exp:"핵심: 사람 선행사 + 주격. 이유: designed의 주어 자리이므로 who."},
{id:"p5-119", week:4, type:"관계사", q:"The firm will reimburse ------ is spent on approved travel expenses.", choices:["whatever","whoever","whichever","however"], answer:0, exp:"핵심: 복합관계대명사가 명사절 주어. 이유: 사물(비용)이므로 whatever."},
{id:"p5-120", week:4, type:"어휘", q:"The new software has greatly ------ the process of tracking inventory.", choices:["qualified","simplified","clarified","verified"], answer:1, exp:"핵심: simplify the process = 과정을 단순화하다. 이유: process와 어울리는 동사는 simplify."},
{id:"p5-121", week:4, type:"어휘", q:"Please be advised that the parking garage will be ------ for maintenance on Saturday.", choices:["inaccessible","incomplete","invalid","indirect"], answer:0, exp:"핵심: inaccessible = 이용 불가한. 이유: 유지보수로 출입이 막힌다는 문맥."},
{id:"p5-122", week:4, type:"어휘", q:"The seminar was ------ by more than three hundred industry professionals.", choices:["joined","attended","participated","visited"], answer:1, exp:"핵심: attend a seminar = 세미나에 참석하다. 이유: 타동사로 수동태 가능한 attended."},
{id:"p5-123", week:4, type:"어휘", q:"The company's ------ to customer satisfaction is reflected in its generous return policy.", choices:["agreement","assignment","judgment","commitment"], answer:3, exp:"핵심: commitment to = ~에 대한 헌신. 이유: to와 결합하는 명사는 commitment."},
{id:"p5-124", week:4, type:"어휘", q:"Despite the ------ weather, the outdoor festival drew a record number of visitors.", choices:["adverse","averse","reverse","diverse"], answer:0, exp:"핵심: adverse weather = 악천후. 이유: Despite와 어울리는 부정적 의미의 adverse."},
{id:"p5-125", week:4, type:"어휘", q:"The manager asked the team to ------ the proposal before submitting it to the client.", choices:["decline","confine","refine","define"], answer:2, exp:"핵심: refine the proposal = 제안서를 다듬다. 이유: 제출 전 보완한다는 문맥."},
{id:"p5-126", week:4, type:"어휘", q:"The bank's loan terms are ------ with those offered by its competitors.", choices:["insistent","persistent","resistant","consistent"], answer:3, exp:"핵심: consistent with = ~와 일치하는. 이유: 경쟁사 조건과 비교하는 문맥."},
{id:"p5-127", week:4, type:"어휘", q:"Employees are ------ to attend the safety briefing scheduled for Monday morning.", choices:["expected","suspected","inspected","respected"], answer:0, exp:"핵심: be expected to = ~하도록 요구되다. 이유: 참석 의무를 나타내는 expected."},
{id:"p5-128", week:4, type:"어휘", q:"The quarterly ------ to shareholders was released on the company's website this morning.", choices:["movement","placement","statement","agreement"], answer:2, exp:"핵심: statement to shareholders = 주주 보고서. 이유: 공개되는 문서는 statement."},
{id:"p5-129", week:4, type:"어휘", q:"Sales representatives who ------ their targets will receive a trip to Bali.", choices:["excel","exceed","expand","extend"], answer:1, exp:"핵심: exceed targets = 목표를 초과하다. 이유: targets를 목적어로 취하는 exceed."},
{id:"p5-130", week:4, type:"시제", q:"By the end of this year, Loma Bakery ------ three new branches in the suburbs.", choices:["opens","opened","has opened","will have opened"], answer:3, exp:"핵심: By the end of this year → 미래완료. 이유: 미래 시점까지의 완료는 will have opened."},
{id:"p5-131", week:4, type:"시제", q:"When the inspector arrived, the staff ------ already cleaned the storage area.", choices:["has","had","have","will have"], answer:1, exp:"핵심: 과거(arrived)보다 먼저 완료 → 과거완료. 이유: had already cleaned."},
{id:"p5-132", week:4, type:"시제", q:"Ms. Fontaine ------ the new branch office until a permanent manager is appointed.", choices:["managed","has managed","will manage","had managed"], answer:2, exp:"핵심: until절 현재시제는 미래 대용. 이유: 주절은 미래시제 will manage."},
{id:"p5-133", week:4, type:"시제", q:"The company ------ its profits every year since it adopted the new pricing model.", choices:["has increased","increased","increases","had increased"], answer:0, exp:"핵심: since + 과거절 → 현재완료. 이유: 과거부터 현재까지 계속된 일."},
{id:"p5-134", week:4, type:"시제", q:"Ten years ago, Halden Logistics ------ only three trucks and a single warehouse.", choices:["owns","owned","has owned","had been owning"], answer:1, exp:"핵심: Ten years ago → 과거시제. 이유: 명확한 과거 시점이므로 owned."},
{id:"p5-135", week:4, type:"수일치", q:"The equipment in the laboratories ------ inspected twice a year by an outside firm.", choices:["are","were","have been","is"], answer:3, exp:"핵심: equipment는 불가산 단수. 이유: in the laboratories는 수식어, 단수 동사 is."},
{id:"p5-136", week:4, type:"수일치", q:"Both the manager and the assistant ------ attending the conference in Seoul next month.", choices:["is","are","was","has been"], answer:1, exp:"핵심: Both A and B → 복수. 이유: 복수 주어이며 next month 문맥이므로 are."},
{id:"p5-137", week:4, type:"수일치", q:"One of the main reasons for the delay ------ the shortage of raw materials.", choices:["were","are","have been","was"], answer:3, exp:"핵심: One of + 복수명사 → 단수 취급. 이유: 주어 One이 단수이므로 was."},
{id:"p5-138", week:4, type:"수일치", q:"There ------ several reasons why the committee rejected the proposal.", choices:["is","was","has","were"], answer:3, exp:"핵심: There + 동사 + 복수 주어. 이유: several reasons가 복수, 과거 문맥이므로 were."},
{id:"p5-139", week:4, type:"품사", q:"The ------ of the new policy will be evaluated after six months.", choices:["effective","effectively","effectiveness","effected"], answer:2, exp:"핵심: The 뒤, of 앞 주어 명사 자리. 이유: 명사 effectiveness가 정답."},
{id:"p5-140", week:4, type:"품사", q:"Ms. Osei is ------ regarded as one of the top analysts in the industry.", choices:["wide","widely","width","widen"], answer:1, exp:"핵심: be동사와 과거분사 사이 부사 자리. 이유: widely regarded는 고정 표현."},
{id:"p5-141", week:4, type:"품사", q:"The company is seeking a ------ candidate for the position of chief financial officer.", choices:["qualify","qualification","qualified","qualifier"], answer:2, exp:"핵심: 관사와 명사 사이 형용사 자리. 이유: 자격을 갖춘 → 과거분사형 형용사 qualified."},
{id:"p5-142", week:4, type:"품사", q:"The hotel's ------ staff received excellent reviews from conference attendees.", choices:["attention","attentive","attentively","attend"], answer:1, exp:"핵심: 소유격과 명사 staff 사이 형용사 자리. 이유: 명사를 수식하는 attentive."},
{id:"p5-143", week:4, type:"품사", q:"To ensure ------, all passwords must be changed every ninety days.", choices:["secure","securely","secured","security"], answer:3, exp:"핵심: 타동사 ensure의 목적어 자리. 이유: 명사 security가 필요."},
{id:"p5-144", week:4, type:"전치사", q:"The seminar will be held ------ the first week of October at the Roswell Center.", choices:["on","at","by","during"], answer:3, exp:"핵심: during + 기간 명사. 이유: the first week라는 기간 앞에는 during."},
{id:"p5-145", week:4, type:"전치사", q:"------ the exception of Ms. Kim, all managers attended the planning session.", choices:["With","By","For","In"], answer:0, exp:"핵심: with the exception of = ~을 제외하고. 이유: 고정 표현이므로 With."},
{id:"p5-146", week:4, type:"전치사", q:"Employees must obtain approval ------ advance before purchasing any equipment over $500.", choices:["at","in","on","for"], answer:1, exp:"핵심: in advance = 미리. 이유: 고정 표현이므로 in."},
{id:"p5-147", week:4, type:"전치사", q:"The factory has reduced water usage by 20 percent ------ installing new filters.", choices:["with","on","by","to"], answer:2, exp:"핵심: by + -ing = ~함으로써. 이유: 수단·방법을 나타내는 전치사 by."},
{id:"p5-148", week:4, type:"접속사", q:"------ the contract has been signed, the construction crew can begin work immediately.", choices:["Now that","Despite","Because of","In case of"], answer:0, exp:"핵심: 절을 이끄는 접속사 자리. 이유: '이제 ~이므로'의 접속사 Now that."},
{id:"p5-149", week:4, type:"접속사", q:"The project was completed ahead of schedule ------ the shortage of skilled workers.", choices:["although","even though","whereas","despite"], answer:3, exp:"핵심: 뒤에 명사구 → 접속사 불가. 이유: 양보의 전치사 despite만 가능."},
{id:"p5-150", week:4, type:"접속사", q:"The manager will approve the overtime request ------ the budget allows it.", choices:["provided that","in case of","despite","as for"], answer:0, exp:"핵심: provided that + 절 = ~라는 조건이면. 이유: 절을 이끄는 조건 접속사."}
];

// LC Part 2 90문항
const PART2 = [
{id:"p2-001", week:1, trap:"의문사", q:"Who is leading the training session tomorrow?", choices:["Ms. Alvarez from Human Resources.","In the second-floor training room.","Yes, I attended it last year."], answer:0, exp:"핵심: Who → 사람으로 답. 이유: (B)는 Where 답, (C)는 의문사 의문문에 Yes/No 불가."},
{id:"p2-002", week:1, trap:"의문사", q:"When will the new printers be delivered?", choices:["Yes, they're much faster.","To the third floor office.","Sometime next Tuesday."], answer:2, exp:"핵심: When → 시점으로 답. 이유: (A)는 Yes/No 불가, (B)는 Where 답."},
{id:"p2-003", week:1, trap:"의문사", q:"Where did you put the client contracts?", choices:["About twenty pages long.","In the top drawer of my desk.","Yes, I signed them."], answer:1, exp:"핵심: Where → 장소로 답. 이유: (A)는 분량(How long) 답, (C)는 Yes/No 불가."},
{id:"p2-004", week:1, trap:"의문사", q:"What time does the flight to Chicago leave?", choices:["At the international terminal.","At a quarter past six.","No, I haven't packed yet."], answer:1, exp:"핵심: What time → 시각으로 답. 이유: (A)는 Where 답, (C)는 Yes/No 불가."},
{id:"p2-005", week:1, trap:"의문사", q:"Why was the shipment delayed?", choices:["There was a storm near the port.","About three hundred boxes.","No, it arrived yesterday."], answer:0, exp:"핵심: Why → 이유로 답. 이유: (B)는 How many 답, (C)는 Yes/No 불가."},
{id:"p2-006", week:1, trap:"의문사", q:"How do I get to the supplier's warehouse?", choices:["Yes, it's quite large.","Around two in the afternoon.","Take the highway and exit at Maple Street."], answer:2, exp:"핵심: How → 방법(길 안내)으로 답. 이유: (A)는 Yes/No 불가, (B)는 When 답."},
{id:"p2-007", week:1, trap:"의문사", q:"Who approved the travel expenses?", choices:["About four hundred dollars.","Yes, on Friday afternoon.","The finance director did."], answer:2, exp:"핵심: Who → 사람으로 답. 이유: (A)는 How much 답, (B)는 Yes/No 불가."},
{id:"p2-008", week:1, trap:"의문사", q:"When is the deadline for the sales report?", choices:["This Friday at noon.","Yes, I've started on it.","In the shared folder."], answer:0, exp:"핵심: When → 시점으로 답. 이유: (B)는 Yes/No 불가, (C)는 Where 답."},
{id:"p2-009", week:1, trap:"의문사", q:"Where should I send the repair invoice?", choices:["Yes, the technician fixed it.","To the accounting department.","It cost about two hundred dollars."], answer:1, exp:"핵심: Where → 보낼 곳으로 답. 이유: (A)는 Yes/No 불가, (C)는 How much 답."},
{id:"p2-010", week:1, trap:"의문사", q:"What is the agenda for this afternoon's meeting?", choices:["We're reviewing the hiring plan.","Yes, at two o'clock.","In the small conference room."], answer:0, exp:"핵심: What(안건) → 내용으로 답. 이유: (B)는 Yes/No 불가, (C)는 Where 답."},
{id:"p2-011", week:1, trap:"의문사", q:"Why is the elevator out of service?", choices:["To the tenth floor.","They're replacing the cables.","No, I took the stairs."], answer:1, exp:"핵심: Why → 이유로 답. 이유: (A)는 Where 답, (C)는 Yes/No 불가."},
{id:"p2-012", week:1, trap:"의문사", q:"How many candidates are we interviewing today?", choices:["In the afternoon, I believe.","Yes, they all look qualified.","Five, if nobody cancels."], answer:2, exp:"핵심: How many → 숫자로 답. 이유: (A)는 When 답, (B)는 Yes/No 불가."},
{id:"p2-013", week:1, trap:"의문사", q:"Who's picking up the clients from the airport?", choices:["Their flight lands at nine.","Yes, the airport is busy.","Jason volunteered to do it."], answer:2, exp:"핵심: Who → 사람으로 답. 이유: (A)는 When 답, (B)는 Yes/No 불가."},
{id:"p2-014", week:1, trap:"의문사", q:"When did Ms. Chen join the company?", choices:["She works in marketing.","About three years ago.","Yes, she's very experienced."], answer:1, exp:"핵심: When → 시점으로 답. 이유: (A)는 부서(Where) 답, (C)는 Yes/No 불가."},
{id:"p2-015", week:1, trap:"의문사", q:"Where is the nearest post office?", choices:["Just across the street from the bank.","It closes at five.","Yes, I need to mail a package."], answer:0, exp:"핵심: Where → 위치로 답. 이유: (B)는 When 답, (C)는 Yes/No 불가."},
{id:"p2-016", week:1, trap:"의문사", q:"What should I bring to the budget review?", choices:["It starts at ten.","Last quarter's expense figures.","Yes, the budget was approved."], answer:1, exp:"핵심: What → 가져올 물건으로 답. 이유: (A)는 When 답, (C)는 Yes/No 불가."},
{id:"p2-017", week:1, trap:"의문사", q:"How long will the software update take?", choices:["About thirty minutes.","Yes, it's the latest version.","The IT department handles it."], answer:0, exp:"핵심: How long → 소요 시간으로 답. 이유: (B)는 Yes/No 불가, (C)는 Who 답."},
{id:"p2-018", week:1, trap:"의문사", q:"Why did the customer cancel the order?", choices:["About fifty units.","No, they paid in full.","They found a cheaper supplier."], answer:2, exp:"핵심: Why → 이유로 답. 이유: (A)는 How many 답, (B)는 Yes/No 불가."},
{id:"p2-019", week:1, trap:"제안/요청", q:"Let's postpone the product launch until spring.", choices:["I agree, we need more time to prepare.","The product is a new laptop.","It launched in two countries."], answer:0, exp:"핵심: Let's 제안 → 동의/거절로 답. 이유: (B)는 product 연상, (C)는 launch 반복 함정."},
{id:"p2-020", week:1, trap:"Yes/No", q:"Have you finished the quarterly audit?", choices:["In the finance office.","It took about a week last year.","Not yet, I need two more days."], answer:2, exp:"핵심: Have you → 완료 여부로 답. 이유: (A)는 Where 답, (B)는 과거 소요 시간으로 질문과 무관."},
{id:"p2-021", week:1, trap:"Yes/No", q:"Is the conference room available at three?", choices:["It seats about twenty people.","Yes, nobody has booked it.","On the fourth floor."], answer:1, exp:"핵심: Is → 가능 여부로 답. 이유: (A)는 How many 답, (C)는 Where 답."},
{id:"p2-022", week:1, trap:"Yes/No", q:"Did Mr. Tanaka call back about the contract?", choices:["The contract is ten pages.","Yes, about an hour ago.","At his main office."], answer:1, exp:"핵심: Did → 여부로 답. 이유: (A)는 contract 반복 함정, (C)는 Where 답."},
{id:"p2-023", week:1, trap:"Yes/No", q:"Are you going to the trade show in Berlin?", choices:["It's held every spring.","By train, probably.","Yes, I leave on Monday."], answer:2, exp:"핵심: Are you → 참석 여부로 답. 이유: (A)는 How often 답, (B)는 How 답."},
{id:"p2-024", week:1, trap:"Yes/No", q:"Do we have enough chairs for the workshop?", choices:["No, we'll need about ten more.","The workshop is about marketing.","In the storage room."], answer:0, exp:"핵심: Do we have → 충분 여부로 답. 이유: (B)는 workshop 반복 함정, (C)는 Where 답."},
{id:"p2-025", week:1, trap:"Yes/No", q:"Can you fix the copier before noon?", choices:["Sure, I'll take a look right now.","It's on the second floor.","About fifty copies."], answer:0, exp:"핵심: Can you → 가능 여부로 답. 이유: (B)는 Where 답, (C)는 copier/copies 연상 함정."},
{id:"p2-026", week:1, trap:"제안/요청", q:"Could you send me the updated price list?", choices:["The prices went up last month.","Of course, I'll email it now.","At the sales counter."], answer:1, exp:"핵심: Could you 요청 → 수락으로 답. 이유: (A)는 price 반복 함정, (C)는 Where 답."},
{id:"p2-027", week:1, trap:"제안/요청", q:"Why don't we take a short break?", choices:["It lasted fifteen minutes.","The brakes need repair.","Good idea, I could use some coffee."], answer:2, exp:"핵심: Why don't we 제안 → 동의로 답. 이유: (A)는 How long 답, (B)는 break/brakes 유사발음 함정."},
{id:"p2-028", week:1, trap:"제안/요청", q:"Would you mind reviewing my presentation slides?", choices:["The presentation is at ten.","About twenty slides.","Not at all, send them over."], answer:2, exp:"핵심: Would you mind → Not at all이 수락. 이유: (A)는 When 답, (B)는 How many 답."},
{id:"p2-029", week:1, trap:"제안/요청", q:"How about meeting the clients for lunch on Thursday?", choices:["That works well for me.","The restaurant is downtown.","Yes, they enjoyed the meal."], answer:0, exp:"핵심: How about 제안 → 동의로 답. 이유: (B)는 Where 답, (C)는 lunch 연상 함정."},
{id:"p2-030", week:1, trap:"제안/요청", q:"Please let me know when the samples arrive.", choices:["They were shipped from Taiwan.","I'll call you as soon as they do.","About twelve samples."], answer:1, exp:"핵심: Please 요청 → 수락으로 답. 이유: (A)는 Where 답, (C)는 How many 답."},
{id:"p2-031", week:3, trap:"유사발음", q:"Could you make a copy of this report for me?", choices:["I'd like some coffee too.","The report is due Friday.","Sure, how many do you need?"], answer:2, exp:"핵심: 요청 → 수락 후 수량 확인. 이유: (A)는 copy/coffee 유사발음 함정, (B)는 report 반복 함정."},
{id:"p2-032", week:3, trap:"유사발음", q:"Did you mail the invoice to the client?", choices:["Yes, I sent it this morning.","No, he's a male employee.","The train leaves at eight."], answer:0, exp:"핵심: Did you mail → 발송 여부로 답. 이유: (B)는 mail/male 유사발음 함정, (C)는 무관한 시각."},
{id:"p2-033", week:3, trap:"유사발음", q:"When will the new accountant start working here?", choices:["Count the boxes carefully.","On the first of next month.","The account was closed."], answer:1, exp:"핵심: When → 시점으로 답. 이유: (A)(C)는 accountant/count/account 유사발음 함정."},
{id:"p2-034", week:3, trap:"유사발음", q:"Where can I find the shipping department?", choices:["It's at the end of this hallway.","The ship sails at noon.","Yes, the package was heavy."], answer:0, exp:"핵심: Where → 위치로 답. 이유: (B)는 shipping/ship 유사발음 함정, (C)는 Yes/No 불가."},
{id:"p2-035", week:3, trap:"유사발음", q:"Has the weather delayed our flight?", choices:["I don't know whether he's coming.","The weight limit is twenty kilos.","Yes, by about two hours."], answer:2, exp:"핵심: Has → 지연 여부로 답. 이유: (A)(B)는 weather/whether/weight 유사발음 함정."},
{id:"p2-036", week:3, trap:"유사발음", q:"Who hired the new receptionist?", choices:["It's higher than I expected.","The office manager did.","Yes, she's receiving calls."], answer:1, exp:"핵심: Who → 사람으로 답. 이유: (A)는 hired/higher 유사발음 함정, (C)는 Yes/No 불가."},
{id:"p2-037", week:3, trap:"연상어휘", q:"Where should we hold the year-end party?", choices:["The food was delicious.","How about the rooftop restaurant?","Everyone enjoyed the music."], answer:1, exp:"핵심: Where → 장소 제안으로 답. 이유: (A)(C)는 party에서 연상되는 food/music 함정."},
{id:"p2-038", week:3, trap:"연상어휘", q:"How often is the office carpet cleaned?", choices:["Once every two weeks.","The vacuum is in the closet.","It's a dark blue color."], answer:0, exp:"핵심: How often → 빈도로 답. 이유: (B)는 cleaned 연상 vacuum, (C)는 carpet 연상 color 함정."},
{id:"p2-039", week:3, trap:"연상어휘", q:"Who is going to drive to the airport?", choices:["My flight was delayed.","The car needs gas.","Rachel offered to take us."], answer:2, exp:"핵심: Who → 사람으로 답. 이유: (A)는 airport 연상 flight, (B)는 drive 연상 car 함정."},
{id:"p2-040", week:3, trap:"연상어휘", q:"When does the bank close on Saturdays?", choices:["At one in the afternoon.","I deposited the check.","The interest rate went up."], answer:0, exp:"핵심: When → 시각으로 답. 이유: (B)(C)는 bank 연상 deposit/interest 함정."},
{id:"p2-041", week:3, trap:"연상어휘", q:"Why is the printer making that noise?", choices:["I need twenty copies.","The paper tray is jammed.","Use the toner on the shelf."], answer:1, exp:"핵심: Why → 원인으로 답. 이유: (A)(C)는 printer 연상 copies/toner 함정."},
{id:"p2-042", week:3, trap:"연상어휘", q:"How did the job interview go?", choices:["Please submit your resume.","The applicant is from Boston.","Better than I expected."], answer:2, exp:"핵심: How did it go → 결과 평가로 답. 이유: (A)(B)는 interview 연상 resume/applicant 함정."},
{id:"p2-043", week:3, trap:"우회응답", q:"What time does the hardware store open?", choices:["Let me check their website.","It sells paint and tools.","Yes, it's open."], answer:0, exp:"핵심: 모르니 확인하겠다는 우회응답. 이유: (B)는 store 연상 함정, (C)는 의문사에 Yes 불가."},
{id:"p2-044", week:3, trap:"우회응답", q:"Has the client signed the agreement yet?", choices:["The agreement is twelve pages.","Yes, sign on the last page.","Mr. Lee is meeting them this afternoon."], answer:2, exp:"핵심: 아직 아님을 상황으로 암시하는 우회응답. 이유: (A)는 agreement 반복, (B)는 sign 반복 함정."},
{id:"p2-045", week:3, trap:"우회응답", q:"Who's responsible for ordering office supplies?", choices:["We need more paper.","It depends on which department you're in.","The supplies arrived yesterday."], answer:1, exp:"핵심: 상황에 따라 다르다는 우회응답. 이유: (A)는 supplies 연상 paper, (C)는 supplies 반복 함정."},
{id:"p2-046", week:3, trap:"우회응답", q:"Are we still meeting with the investors tomorrow?", choices:["I haven't heard anything different.","The investment was quite large.","Yes, we met them last year."], answer:0, exp:"핵심: 변경 소식 없음 = 예정대로라는 우회응답. 이유: (B)는 investors/investment 유사, (C)는 시제 불일치."},
{id:"p2-047", week:3, trap:"우회응답", q:"How much will the roof repair cost?", choices:["The roof leaks when it rains.","Yes, the roofer came yesterday.","The estimate hasn't come in yet."], answer:2, exp:"핵심: 견적이 아직 없다는 우회응답. 이유: (A)는 roof 반복 함정, (B)는 의문사에 Yes 불가."},
{id:"p2-048", week:3, trap:"우회응답", q:"Will the new hire start on Monday?", choices:["Yes, she's very tall.","Her paperwork isn't finished yet.","She was hired in May."], answer:1, exp:"핵심: 서류 미완료 = 월요일 시작 어렵다는 우회응답. 이유: (A)는 무관한 Yes, (C)는 hire/hired 반복 함정."},
{id:"p2-049", week:3, trap:"되묻기", q:"Could you book a hotel for the sales team?", choices:["For which dates?","The hotel has a pool.","Yes, I read the book."], answer:0, exp:"핵심: 요청에 세부 정보를 되묻는 응답. 이유: (B)는 hotel 연상 함정, (C)는 book(예약/책) 다의어 함정."},
{id:"p2-050", week:3, trap:"되묻기", q:"Where should I file these customer complaints?", choices:["The customers were unhappy.","Yes, please file them.","Are they from this month?"], answer:2, exp:"핵심: 분류 기준을 되묻는 응답. 이유: (A)는 complaints 연상 함정, (B)는 의문사에 Yes 불가."},
{id:"p2-051", week:3, trap:"되묻기", q:"When is the company picnic?", choices:["Do you mean the one in July?","At the city park.","Yes, I'm bringing sandwiches."], answer:0, exp:"핵심: 어떤 행사인지 되묻는 응답. 이유: (B)는 Where 답, (C)는 picnic 연상 함정."},
{id:"p2-052", week:3, trap:"되묻기", q:"Can you give me a ride to the station?", choices:["The train was crowded.","Which station are you going to?","Yes, the ride was smooth."], answer:1, exp:"핵심: 목적지를 되묻는 응답. 이유: (A)는 station 연상 train, (C)는 ride 반복 함정."},
{id:"p2-053", week:3, trap:"부정의문문", q:"Didn't you order the replacement parts last week?", choices:["The parts are very small.","No, they're not replaced.","Yes, but they haven't arrived yet."], answer:2, exp:"핵심: 부정의문문도 사실 기준으로 Yes/No. 주문했으면 Yes. 이유: (A)는 parts 반복, (B)는 replacement 반복 함정."},
{id:"p2-054", week:3, trap:"부정의문문", q:"Isn't the marketing director on vacation?", choices:["She directs the ads.","No, she came back yesterday.","To Hawaii, I think."], answer:1, exp:"핵심: 휴가 중이 아니면 No. 이유: (A)는 director/directs 유사, (C)는 Where 답."},
{id:"p2-055", week:3, trap:"부정의문문", q:"Haven't we already paid this invoice?", choices:["Yes, I sent the payment last Friday.","The invoice is for printing.","No, the price was fair."], answer:0, exp:"핵심: 지불했으면 Yes. 이유: (B)는 invoice 반복, (C)는 paid/price 연상 함정."},
{id:"p2-056", week:3, trap:"부정의문문", q:"Aren't you attending the safety training today?", choices:["It's a safe building.","Yes, I'll be there at two.","No, the trainer is Mr. Cole."], answer:1, exp:"핵심: 참석하면 Yes. 이유: (A)는 safety/safe 유사, (C)는 training/trainer 유사발음 함정."},
{id:"p2-057", week:3, trap:"선택의문문", q:"Would you like the report by email or in print?", choices:["Yes, I would like it.","The report is finished.","Email is fine, thanks."], answer:2, exp:"핵심: A or B → 하나를 선택. 이유: (A)는 선택의문문에 Yes 불가, (B)는 report 반복 함정."},
{id:"p2-058", week:3, trap:"선택의문문", q:"Should we take the train or drive to the conference?", choices:["The train would be faster.","Yes, the conference is in Boston.","I drove last week."], answer:0, exp:"핵심: 둘 중 하나 선택. 이유: (B)는 Yes 불가, (C)는 drive/drove 반복 함정."},
{id:"p2-059", week:3, trap:"선택의문문", q:"Is the staff meeting on Tuesday or Wednesday?", choices:["It will last an hour.","Yes, all staff must attend.","Neither, it was moved to Thursday."], answer:2, exp:"핵심: 둘 다 아님(Neither)도 정답 가능. 이유: (A)는 How long 답, (B)는 Yes 불가."},
{id:"p2-060", week:3, trap:"선택의문문", q:"Do you want the window seat or the aisle?", choices:["The flight is three hours.","Either one is fine with me.","Yes, I booked it online."], answer:1, exp:"핵심: 둘 다 괜찮다(Either)도 정답 가능. 이유: (A)는 seat 연상 flight, (C)는 Yes 불가."},
{id:"p2-061", week:4, trap:"평서문", q:"The air conditioner in the lobby isn't working.", choices:["It's a sunny day.","I'll call the maintenance team.","Yes, the lobby is large."], answer:1, exp:"핵심: 문제 제기 평서문 → 해결 행동으로 답. 이유: (A)는 air 연상 날씨, (C)는 lobby 반복 함정."},
{id:"p2-062", week:4, trap:"평서문", q:"We've run out of printer paper again.", choices:["I'll order some more today.","The printer is new.","No, I didn't print it."], answer:0, exp:"핵심: 부족 알림 → 조치로 답. 이유: (B)(C)는 printer/print 반복 함정."},
{id:"p2-063", week:4, trap:"평서문", q:"Our flight has been moved to gate twelve.", choices:["The ticket cost three hundred dollars.","Yes, it's a direct flight.","Then we'd better hurry."], answer:2, exp:"핵심: 정보 전달 → 그에 따른 반응. 이유: (A)는 flight 연상 ticket, (B)는 flight 반복 함정."},
{id:"p2-064", week:4, trap:"평서문", q:"I think the sales figures are higher than last year.", choices:["The sale ends tomorrow.","At the sales counter.","Yes, by nearly ten percent."], answer:2, exp:"핵심: 의견 제시 → 동의하며 보충. 이유: (A)(B)는 sales/sale 유사발음·연상 함정."},
{id:"p2-065", week:4, trap:"평서문", q:"The client wants to move the meeting to Friday.", choices:["The client is from Spain.","That's fine, I'm free that day.","Yes, it was a long meeting."], answer:1, exp:"핵심: 일정 변경 알림 → 수락으로 답. 이유: (A)는 client 반복, (C)는 meeting 반복 함정."},
{id:"p2-066", week:4, trap:"평서문", q:"I can't find the key to the supply closet.", choices:["Ask the receptionist for the spare one.","The closet is full.","Yes, it's a brass key."], answer:0, exp:"핵심: 문제 제기 → 해결책 제안. 이유: (B)는 closet 반복, (C)는 key 반복 함정."},
{id:"p2-067", week:4, trap:"평서문", q:"The new accounting software is really confusing.", choices:["There's a training session on Thursday.","The accountant left early.","No, it was expensive."], answer:0, exp:"핵심: 불만 → 도움 정보 제공. 이유: (B)는 accounting/accountant 유사, (C)는 무관한 No."},
{id:"p2-068", week:4, trap:"평서문", q:"Mr. Patel's retirement party is next Friday.", choices:["He's retiring in Florida.","Yes, he's a good manager.","I've already signed the card."], answer:2, exp:"핵심: 행사 알림 → 관련 행동으로 반응. 이유: (A)는 retirement/retiring 유사, (B)는 무관한 Yes."},
{id:"p2-069", week:4, trap:"부가의문문", q:"The shipment arrived on time, didn't it?", choices:["The shipment was from Vietnam.","Yes, it came this morning.","At three o'clock."], answer:1, exp:"핵심: 부가의문문 → 사실 확인 Yes/No. 이유: (A)는 shipment 반복, (C)는 When 답."},
{id:"p2-070", week:4, trap:"부가의문문", q:"You've met the new vice president, haven't you?", choices:["She started in June.","No, the president is in Tokyo.","Not yet, but I've heard good things."], answer:2, exp:"핵심: 만났는지 여부로 답. 이유: (A)는 When 답, (B)는 president 반복 함정."},
{id:"p2-071", week:4, trap:"부가의문문", q:"The quarterly report is due tomorrow, isn't it?", choices:["Actually, the deadline was extended.","It's about twenty pages.","Yes, I reported it."], answer:0, exp:"핵심: 사실이 다르면 정정하는 응답. 이유: (B)는 분량 답, (C)는 report/reported 유사발음 함정."},
{id:"p2-072", week:4, trap:"부가의문문", q:"This printer can scan documents, can't it?", choices:["The documents are confidential.","Yes, just press the green button.","I can't find the scanner."], answer:1, exp:"핵심: 기능 확인 → Yes + 방법. 이유: (A)는 documents 반복, (C)는 scan/scanner 유사 함정."},
{id:"p2-073", week:4, trap:"간접의문문", q:"Do you know where the staff parking lot is?", choices:["It's behind the main building.","Yes, I parked my car.","The lot is full of staff."], answer:0, exp:"핵심: 간접의문문은 안의 where에 답. 이유: (B)는 Yes만 하고 정보 없음, (C)는 staff/lot 반복 함정."},
{id:"p2-074", week:4, trap:"간접의문문", q:"Could you tell me when the next shuttle leaves?", choices:["The shuttle is free.","Yes, I can tell you.","In about ten minutes."], answer:2, exp:"핵심: 안의 when에 시점으로 답. 이유: (A)는 shuttle 반복, (B)는 Yes만 하고 정보 없음."},
{id:"p2-075", week:4, trap:"간접의문문", q:"Do you have any idea who's replacing Ms. Gomez?", choices:["She's going to Madrid.","I heard it's someone from the Denver office.","Yes, I have an idea."], answer:1, exp:"핵심: 안의 who에 사람으로 답. 이유: (A)는 Where 답, (C)는 idea 반복 함정."},
{id:"p2-076", week:4, trap:"간접의문문", q:"Can you tell me how much the repair will cost?", choices:["The repair shop opens at nine.","Yes, it was repaired.","Around two hundred dollars."], answer:2, exp:"핵심: 안의 how much에 금액으로 답. 이유: (A)(B)는 repair 반복 함정."},
{id:"p2-077", week:4, trap:"우회응답", q:"When will the new office furniture arrive?", choices:["The supplier hasn't confirmed yet.","It's made of oak.","Yes, I ordered six desks."], answer:0, exp:"핵심: 아직 확정 안 됐다는 우회응답. 이유: (B)는 furniture 연상, (C)는 의문사에 Yes 불가."},
{id:"p2-078", week:4, trap:"우회응답", q:"Who's giving the keynote speech at the conference?", choices:["The speech was inspiring.","Check the program on the website.","Yes, the conference is in May."], answer:1, exp:"핵심: 확인 방법을 알려주는 우회응답. 이유: (A)는 speech 반복, (C)는 Yes 불가."},
{id:"p2-079", week:4, trap:"우회응답", q:"Is the budget proposal ready for review?", choices:["The budget is quite large.","Yes, I reviewed it last year.","I'm still waiting on the numbers from sales."], answer:2, exp:"핵심: 아직 아님을 이유로 설명하는 우회응답. 이유: (A)는 budget 반복, (B)는 review 반복·시제 불일치."},
{id:"p2-080", week:4, trap:"우회응답", q:"Why hasn't the technician arrived yet?", choices:["There was heavy traffic downtown.","The technician fixed the server.","No, he's not a technician."], answer:0, exp:"핵심: Why → 추정 이유로 답. 이유: (B)(C)는 technician 반복 함정, (C)는 No 불가."},
{id:"p2-081", week:4, trap:"우회응답", q:"Did the customer accept our refund offer?", choices:["The refund is fifty dollars.","Yes, the customer is here.","I haven't heard back from them."], answer:2, exp:"핵심: 아직 모른다는 우회응답. 이유: (A)는 refund 반복, (B)는 customer 반복 함정."},
{id:"p2-082", week:4, trap:"우회응답", q:"How many people registered for the webinar?", choices:["The webinar is about finance.","I'll pull up the numbers for you.","Yes, I registered yesterday."], answer:1, exp:"핵심: 확인해 주겠다는 우회응답. 이유: (A)는 webinar 반복, (C)는 의문사에 Yes 불가."},
{id:"p2-083", week:4, trap:"선택의문문", q:"Should I call the supplier now or wait until Monday?", choices:["Monday would be better, they're closed today.","Yes, call them.","The supplier is in Ohio."], answer:0, exp:"핵심: 둘 중 하나 선택 + 이유. 이유: (B)는 Yes 불가, (C)는 supplier 반복 함정."},
{id:"p2-084", week:4, trap:"선택의문문", q:"Would you prefer to meet in the morning or after lunch?", choices:["Lunch was delicious.","Whichever works for your schedule.","Yes, I'll meet you."], answer:1, exp:"핵심: 상대에게 맡기는 응답도 정답. 이유: (A)는 lunch 반복, (C)는 Yes 불가."},

{q:"Why is Mr. Baxter running late?",choices:["He got lost","He forgot the handouts","There is heavy traffic","His car broke down"],answer:2,exp:"핵심: 지연 이유 → 'Traffic on the bridge is terrible'. 이유: terrible traffic → heavy traffic."}]},

{id:"p7-04", week:3, kind:"advertisement", title:"Advertisement: Hubbard Street Workspace", text:"Hubbard Street Workspace\nFlexible Offices for Growing Teams\n\nTired of long leases and empty desks? Hubbard Street Workspace offers private offices and shared desks on monthly terms, with no deposit required. Every membership includes high-speed Internet, unlimited coffee, and access to our rooftop lounge.\n\nOur meeting rooms seat four to twenty people and can be reserved through our mobile app, often with less than an hour's notice. Members also enjoy 24-hour building access with a secure key card.\n\nSpecial Offer: Sign up before November 30 and receive your first month at half price. Teams of five or more qualify for a dedicated office with a lockable door.\n\nSchedule a tour today at www.hubbardworkspace.example or stop by 212 Hubbard Street, Monday through Friday, 9:00 A.M. to 6:00 P.M.", questions:[
{q:"What is NOT mentioned as a feature of the membership?",choices:["Free parking","Internet access","A rooftop lounge","24-hour access"],answer:0,exp:"핵심: NOT 문제 → 보기를 하나씩 지문과 대조. 이유: 주차는 언급되지 않음."},
{q:"What is suggested about the meeting rooms?",choices:["They must be booked a week in advance","They are available only to teams of five","They can be reserved on short notice","They are located on the rooftop"],answer:2,exp:"핵심: 추론 → 'less than an hour's notice'. 이유: 한 시간 미만의 통지 → 짧은 시간 내 예약 가능(paraphrase)."}]},

{id:"p7-05", week:3, kind:"article", title:"Article: Cordova Transit Launches Mobile Ticketing", text:"Cordova Transit Launches Mobile Ticketing\n\nCORDOVA (May 4) — Starting next Monday, riders on Cordova Transit buses and trains will be able to buy and display tickets on their smartphones. The new app, called GoCordova, replaces the paper passes that have been sold at station kiosks for more than twenty years.\n\nTransit director Amara Osei said the change was prompted by rider surveys in which nearly 70 percent of respondents asked for a cashless option. \"People already manage their banking and groceries on their phones,\" she said. \"Transit should be just as convenient.\"\n\nPaper passes will still be accepted until the end of the year. After that, riders without a smartphone can purchase a reloadable plastic card at any station. The agency expects the app to reduce boarding times by eliminating the need for drivers to inspect paper tickets.", questions:[
{q:"According to the article, why did Cordova Transit introduce the app?",choices:["To respond to rider feedback","To reduce ticket prices","To replace its aging buses","To attract tourists"],answer:0,exp:"핵심: 이유 → 'prompted by rider surveys'. 이유: 설문 응답자의 요청 = rider feedback(paraphrase)."},
{q:"The word \"prompted\" in paragraph 2 is closest in meaning to",choices:["delayed","measured","questioned","motivated"],answer:3,exp:"핵심: 동의어 → '촉발하다'. 이유: 설문이 변화를 이끌었다는 문맥이므로 motivated."},
{q:"What is implied about paper passes?",choices:["They will be sold at a discount","They will no longer be accepted after December","They are more popular than the app","They can be loaded onto the plastic card"],answer:1,exp:"핵심: 추론 → 'accepted until the end of the year'. 이유: 연말까지만 허용 = 12월 이후 사용 불가."}]},

{id:"p7-06", week:3, kind:"letter", title:"Letter: Conference Booking Confirmation", text:"Ridgeway Grand Hotel\n48 Lakeshore Drive, Belmont\n\nAugust 3\n\nMr. Victor Salazar\nEvents Coordinator, Pinecrest Software\n\nDear Mr. Salazar,\n\nThank you for choosing the Ridgeway Grand Hotel for your company's annual sales conference on October 12 and 13. This letter confirms your reservation of the Lakeview Ballroom for both days, along with forty guest rooms at the corporate rate of $145 per night.\n\nAs discussed, the ballroom will be arranged in classroom style for 120 attendees. Our audiovisual team will test the sound system on the morning of October 12. Please send us your final attendee count by September 28 so that our catering staff can plan the meals accordingly.\n\nA deposit of 25 percent is due upon receipt of this letter; the balance will be billed after the event. I look forward to working with you.\n\nSincerely,\nGwen Harlan\nDirector of Sales", questions:[
{q:"What is Mr. Salazar asked to do by September 28?",choices:["Pay the full balance","Choose a seating arrangement","Confirm the number of attendees","Test the sound system"],answer:2,exp:"핵심: 요청 사항 → 'Please send us ... by September 28'. 이유: final attendee count → number of attendees(paraphrase)."},
{q:"The word \"balance\" in paragraph 3 is closest in meaning to",choices:["stability","schedule","agreement","remaining amount"],answer:3,exp:"핵심: 다의어 balance → 금전 문맥. 이유: 보증금 25%를 제외한 '잔액'이므로 remaining amount."}]},

{id:"p7-07", week:3, kind:"review", title:"Review: Silverline Roller Bag", text:"Customer Review: Silverline Luggage Co. Roller Bag\nRating: 4 out of 5 stars\nReviewed by Hannah Pruitt on March 18\n\nI bought the Silverline 22-inch roller bag for a two-week business trip across Europe, and overall I was pleased. The wheels glide smoothly over cobblestones, and the bag fit easily into the overhead compartments on every flight I took. The built-in USB port was especially handy for charging my phone during long layovers.\n\nMy only complaint is the zipper on the front pocket, which started to stick after about ten days of use. I contacted customer service, and they offered to replace the bag at no cost, which I appreciated. Still, for a product in this price range, I expected sturdier hardware.\n\nWould I recommend it? Yes, especially for frequent travelers who value light weight over heavy-duty construction.", questions:[
{q:"What did Ms. Pruitt like about the bag?",choices:["Its large capacity","Its charging feature","Its low price","Its color options"],answer:1,exp:"핵심: 긍정 포인트 → 'USB port was especially handy'. 이유: USB port → charging feature(paraphrase)."},
{q:"The word \"handy\" in paragraph 1 is closest in meaning to",choices:["useful","small","nearby","expensive"],answer:0,exp:"핵심: 동의어 → '편리한'. 이유: 충전에 도움이 되었다는 문맥이므로 useful."},
{q:"What is implied about Silverline's customer service?",choices:["It was slow to respond","It charged a repair fee","It was willing to resolve the problem","It could not be reached"],answer:2,exp:"핵심: 추론 → 'offered to replace the bag at no cost'. 이유: 무료 교체 제안 = 문제 해결 의지."}]},

{id:"p7-08", week:3, kind:"schedule", title:"Schedule: New Employee Orientation", text:"Harwood Financial Group\nNew Employee Orientation Schedule\nWednesday, January 14 — Conference Room A\n\n9:00 A.M. – 9:30 A.M. Welcome and Company Overview (Nadia Brooks, Director of Human Resources)\n9:30 A.M. – 10:30 A.M. Benefits and Payroll Enrollment (Carl Ingram, Payroll Specialist)\n10:30 A.M. – 10:45 A.M. Break\n10:45 A.M. – 12:00 P.M. Information Security Training (IT Department) *\n12:00 P.M. – 1:00 P.M. Lunch (provided)\n1:00 P.M. – 2:30 P.M. Department Introductions and Office Tour (team managers)\n2:30 P.M. – 3:00 P.M. Questions and Wrap-Up (Nadia Brooks)\n\n* Attendance at this session is mandatory. Employees who miss it will not receive network access until they complete the online version.\n\nPlease bring a government-issued ID and your signed employment agreement to the morning session. Laptops will be distributed during the office tour.", questions:[
{q:"Who will lead the session on employee benefits?",choices:["Nadia Brooks","The IT Department","Team managers","Carl Ingram"],answer:3,exp:"핵심: 세부 사항 → 일정표에서 Benefits 항목 찾기. 이유: 'Carl Ingram, Payroll Specialist'가 담당."},
{q:"What is suggested about the information security session?",choices:["It is held online only","It is optional for managers","It must be completed before using the company network","It will take place after lunch"],answer:2,exp:"핵심: 추론 → 각주(*) 확인. 이유: 'will not receive network access until' → 네트워크 사용의 조건."}]},

{id:"p7-09", week:3, kind:"email", title:"E-mail: Trade Show Action Items", text:"To: Marketing Team\nFrom: Jonas Keller\nSubject: Trade Show Booth — Action Items\nDate: February 2\n\nHi all,\n\nWe have secured a 10-by-20-foot booth at the Pacific Retail Expo, which runs from March 24 to March 26 in Seattle. Since this is our largest show of the year, I want to finalize the plan this week.\n\nAmy, please order 500 copies of the new product catalog from the printer by Friday. Last year we ran out by the second day, so I would rather have extras. Rohan, confirm the shipment of the demo units with the warehouse; they need to arrive at the convention center no later than March 22.\n\nI have booked four hotel rooms near the venue. If you plan to attend, add your name to the shared spreadsheet by February 9 so I can release any rooms we do not need.\n\nThanks,\nJonas", questions:[
{q:"Why did Mr. Keller send the e-mail?",choices:["To announce a new product","To assign tasks for an upcoming event","To request a budget increase","To cancel a hotel reservation"],answer:1,exp:"핵심: 목적 → 제목 'Action Items'와 지시문. 이유: 팀원별로 할 일을 배정하고 있음."},
{q:"What is suggested about last year's expo?",choices:["It was held in a different city","The booth was smaller","The catalogs were insufficient","The demo units arrived late"],answer:2,exp:"핵심: 추론 → 'Last year we ran out by the second day'. 이유: ran out → insufficient(paraphrase)."},
{q:"What should team members do by February 9?",choices:["Order catalogs","Ship demo units","Book a flight","Indicate whether they will attend"],answer:3,exp:"핵심: 날짜 단서 February 9 찾기. 이유: 'add your name to the shared spreadsheet' = 참석 의사 표시."}]},

{id:"p7-10", week:3, kind:"form", title:"Form: Facility Rental Request", text:"Westbrook Community Center\nFacility Rental Request Form\n\nApplicant Name: Teresa Quon\nOrganization: Northside Small Business Association\nPhone: 555-0167\nE-mail: tquon@nsba.example\n\nRoom Requested: Main Hall (capacity 150)\nDate of Event: Saturday, June 20\nTime: 5:00 P.M. – 10:00 P.M. (includes one hour for setup and one hour for cleanup)\nType of Event: Annual awards dinner\nExpected Attendance: 110\n\nAdditional Services (check all that apply):\n[X] Tables and chairs\n[X] Sound system\n[ ] Kitchen access\n[X] Parking attendant\n\nSpecial Requests: We will use an outside caterer, so kitchen access is not required. However, we would like the stage lights tested before the event begins.\n\nFOR OFFICE USE ONLY\nRental fee: $480\nDeposit received: $120 on May 2\nApproved by: R. Flores, Facilities Coordinator", questions:[
{q:"What is indicated about the event?",choices:["It will be held on a weekday","It will begin at 10:00 P.M.","Kitchen access has been requested","Food will be provided by an outside company"],answer:3,exp:"핵심: 세부 사항 → Special Requests 확인. 이유: outside caterer → 외부 업체가 음식 제공(paraphrase)."},
{q:"What can be inferred about the Main Hall?",choices:["It is larger than needed for the event","It has no sound system","It is unavailable on weekends","It requires full payment in advance"],answer:0,exp:"핵심: 추론 → 수용 인원 150 vs 예상 참석 110. 이유: 수용 인원이 참석자 수보다 많음."}]},

{id:"p7-11", week:3, kind:"notice", title:"Notice: TerraFlow Bottle Lid Defect", text:"IMPORTANT PRODUCT NOTICE\nTerraFlow Water Bottles — Model TF-500\n\nTerraFlow Outdoor has identified a defect in the lid of the TF-500 insulated bottle manufactured between January and April of this year. In some units, the locking tab may fail to hold the lid closed, causing leaks. No injuries have been reported, but we are asking customers to stop using affected bottles immediately.\n\nTo check whether your bottle is affected, look at the four-digit code printed on the bottom. Codes beginning with 01, 02, 03, or 04 are included in this notice. Bottles with codes beginning with 05 or higher were produced with a redesigned lid and are not affected.\n\nCustomers can request a free replacement lid at www.terraflow.example/lid or by calling 1-800-555-0199. Replacement lids will ship within ten business days. Proof of purchase is not required.\n\nWe apologize for the inconvenience.", questions:[
{q:"What is the purpose of the notice?",choices:["To introduce a new bottle design","To inform customers about a product defect","To announce a price reduction","To recruit product testers"],answer:1,exp:"핵심: 목적 → 첫 문단 'identified a defect'. 이유: 결함을 알리고 조치를 요청함."},
{q:"Which bottles are NOT affected by the notice?",choices:["Those with codes beginning with 02","Those purchased online","Those with codes beginning with 06","Those bought without a receipt"],answer:2,exp:"핵심: 세부 사항 → '05 or higher ... not affected'. 이유: 06은 05 이상이므로 해당 없음."},
{q:"The word \"identified\" in paragraph 1 is closest in meaning to",choices:["named","corrected","sold","discovered"],answer:3,exp:"핵심: 동의어 → '발견하다'. 이유: 결함을 찾아냈다는 문맥이므로 discovered."}]},

{id:"p7-12", week:3, kind:"email", title:"E-mail: Group Booking Inquiry", text:"To: Kenji Watanabe\nFrom: reservations@altavista-rail.example\nSubject: Re: Group Booking Inquiry\n\nDear Mr. Watanabe,\n\nThank you for your inquiry about group travel on the Altavista Express from Linden to Mount Carrow on November 7. I am pleased to confirm that we can accommodate your party of 18 in a reserved section of the panoramic car, which offers the best views of the valley.\n\nGroups of 15 or more receive a 12 percent discount on standard fares. For your group, the total comes to $1,584, which includes seat reservations and a light breakfast served on board. To hold the seats, we require a nonrefundable deposit of $300 by October 15; the remaining amount may be paid up to seven days before departure.\n\nPlease let me know if you would like to proceed, and I will send a booking form.\n\nKind regards,\nFelicia Moreau\nGroup Travel Desk", questions:[
{q:"The word \"accommodate\" in paragraph 1 is closest in meaning to",choices:["entertain","transport","charge","make room for"],answer:3,exp:"핵심: 동의어 → '수용하다'. 이유: 18명을 받을 수 있다는 문맥이므로 make room for."},
{q:"What is implied about the deposit?",choices:["It will be returned if the trip is canceled","It must be paid in cash","It cannot be refunded","It covers the cost of breakfast"],answer:2,exp:"핵심: 추론 → 'nonrefundable deposit'. 이유: nonrefundable → cannot be refunded(paraphrase)."}]},

{id:"p7-13", week:4, kind:"text message chain", title:"Text Message Chain: Launch Banners", text:"Olivia Park (2:03 P.M.): Hi Daniel, the printer just told me the banners for Saturday's product launch won't be ready until Monday. Their machine broke down.\n\nDaniel Ruiz (2:05 P.M.): That's a problem. The venue opens at 8 A.M. on Saturday. Do we have another option?\n\nOlivia Park (2:07 P.M.): I called QuickSign on Fifth Avenue. They can do it by Friday afternoon, but it will cost about 30 percent more.\n\nDaniel Ruiz (2:08 P.M.): Go ahead. We can't have an empty stage. Did you send them the artwork?\n\nOlivia Park (2:10 P.M.): Not yet. I wanted your approval first. I'll e-mail the files now and pick the banners up myself on Friday.\n\nDaniel Ruiz (2:11 P.M.): Perfect. Let me know once QuickSign confirms the order, and I'll update the budget sheet.", questions:[
{q:"Why will the original banners be late?",choices:["The artwork was sent too late","The order was placed at the wrong shop","The venue changed its schedule","The printer's equipment failed"],answer:3,exp:"핵심: 지연 원인 → 'Their machine broke down'. 이유: machine broke down → equipment failed(paraphrase)."},
{q:"At 2:08 P.M., what does Mr. Ruiz mean when he writes, \"Go ahead\"?",choices:["Ms. Park should visit the venue","Ms. Park may place the more expensive order","Ms. Park should wait until Monday","Ms. Park can leave the office early"],answer:1,exp:"핵심: 의도 파악 → 직전 제안(30% 더 비싼 대안). 이유: 그 제안을 승인한다는 뜻."},
{q:"What will Ms. Park do on Friday?",choices:["Update the budget","Meet with the printer","Collect the banners","Approve the artwork"],answer:2,exp:"핵심: 날짜 단서 Friday → 'pick the banners up myself'. 이유: pick up → collect(paraphrase)."}]},

{id:"p7-14", week:4, kind:"article", title:"Article: Remote Work Survey", text:"Remote Work Survey Shows Shift in Office Use\n\nA survey of 1,200 companies released on Thursday by the Brennan Institute found that 58 percent of employers now allow staff to work from home at least two days a week, up from 31 percent three years ago. As a result, many firms are reducing the amount of office space they rent.\n\nHowever, the report cautions that smaller offices do not always mean lower costs. Companies that cut space too quickly often spend more later on meeting-room rentals and technology upgrades. \"The most successful firms redesign their offices around collaboration rather than individual desks,\" said lead researcher Dr. Paul Whitaker.\n\nThe institute recommends that companies track how often each area of their office is actually used for at least six months before signing a new lease.", questions:[
{q:"According to the article, what has increased over the past three years?",choices:["The number of employers permitting remote work","The cost of office rentals","The size of corporate meeting rooms","The length of standard office leases"],answer:0,exp:"핵심: 세부 사항 → 58% vs 31% 비교. 이유: 재택근무를 허용하는 기업 비율이 증가."},
{q:"What does Dr. Whitaker suggest about successful companies?",choices:["They have eliminated offices entirely","They rent the largest spaces available","They organize their offices to support teamwork","They require employees to work on site daily"],answer:2,exp:"핵심: 추론 → 'redesign ... around collaboration'. 이유: collaboration → teamwork(paraphrase)."}]},

{id:"p7-15", week:4, kind:"letter", title:"Letter: Accounting Firm Relocation", text:"Pemberton & Vale Accounting\n310 Chestnut Avenue, Suite 5\nFairmont\n\nNovember 12\n\nDear Valued Client,\n\nAfter fifteen years at our Chestnut Avenue office, Pemberton & Vale Accounting will move to a larger space at 85 Union Plaza on December 1. The new office is located directly above the Union Plaza subway station and offers two hours of free client parking in the attached garage.\n\nOur phone numbers and e-mail addresses will remain the same. However, please update your records with the new mailing address, as documents sent to Chestnut Avenue after December 15 may be returned to the sender.\n\nTo celebrate the move, we will host an open house on Friday, December 5, from 4:00 P.M. to 7:00 P.M. Light refreshments will be served, and our tax specialists will be available to answer questions about the upcoming filing season. We hope to see you there.\n\nSincerely,\nMargaret Vale\nManaging Partner", questions:[
{q:"What is the main purpose of the letter?",choices:["To announce a change of location","To introduce a new tax specialist","To request overdue payments","To explain new filing rules"],answer:0,exp:"핵심: 목적 → 첫 문단 'will move to a larger space'. 이유: 사무실 이전을 안내함."},
{q:"What is NOT mentioned about the new office?",choices:["It is near public transportation","It offers free parking","It has more space","It has a larger staff"],answer:3,exp:"핵심: NOT 문제 → 보기별로 지문과 대조. 이유: 직원 수 증가는 언급 없음."},
{q:"What will happen on December 5?",choices:["The office will close for the move","Clients can attend a reception","Tax forms will be mailed","The phone numbers will change"],answer:1,exp:"핵심: 날짜 단서 → open house. 이유: open house → reception(paraphrase)."}]},

{id:"p7-16", week:4, kind:"advertisement", title:"Advertisement: Corporate Wellness Program", text:"Summit Peak Fitness — Corporate Wellness Program\n\nHealthy employees are productive employees. Summit Peak Fitness now offers corporate memberships designed for companies of every size.\n\nWhat your team gets:\n- Unlimited access to all six Summit Peak locations\n- Two on-site wellness seminars per year at your office\n- A dedicated account manager for billing and scheduling\n- Monthly usage reports to help you measure participation\n\nPricing starts at $29 per employee per month for companies enrolling at least 20 staff members. Companies with 100 or more participants receive a complimentary fitness assessment for each employee.\n\nAlready a Summit Peak member? Your company's enrollment will automatically convert your individual plan to the corporate rate at your next billing date.\n\nContact our corporate sales team at corporate@summitpeak.example to request a proposal.", questions:[
{q:"What is included in the corporate membership?",choices:["Seminars held at the client's workplace","Free personal training sessions","Discounted sports equipment","Daily fitness classes online"],answer:0,exp:"핵심: 세부 사항 → 목록 확인. 이유: 'on-site wellness seminars ... at your office' → 고객 직장에서 열리는 세미나(paraphrase)."},
{q:"What is suggested about current individual members?",choices:["They must cancel their plans before enrolling","They will pay more under the corporate plan","Their plans will be switched to the corporate rate","They are not eligible for the program"],answer:2,exp:"핵심: 추론 → 마지막 문단 'automatically convert'. 이유: convert → switched(paraphrase)."}]},

{id:"p7-17", week:4, kind:"email", title:"E-mail: Sales Report Corrections", text:"To: Fiona Castle\nFrom: Leo Marchetti\nSubject: Quarterly Sales Report — Corrections Needed\nDate: April 8\n\nHi Fiona,\n\nI reviewed the draft of the first-quarter sales report you sent yesterday, and most of it looks great. Before we present it to the board on April 15, there are a few things that need attention.\n\nFirst, the figures for the Eastern region on page 4 do not match the totals in the summary table. I believe the February numbers were entered twice. Second, the chart on page 7 uses last year's color scheme, which may confuse readers who compare it with the previous report.\n\nFinally, could you add a short section explaining why online sales dropped in March? The board will certainly ask about it, and I would rather address the question in the report than be caught off guard.\n\nPlease send me the revised version by Friday.\n\nThanks,\nLeo", questions:[
{q:"Why did Mr. Marchetti write the e-mail?",choices:["To request changes to a document","To schedule a board meeting","To announce a sales increase","To ask for a deadline extension"],answer:0,exp:"핵심: 목적 → 제목 'Corrections Needed'. 이유: 보고서 수정 사항을 요청함."},
{q:"What problem does Mr. Marchetti mention about page 4?",choices:["It is missing a chart","It contains a duplicate entry","It uses the wrong colors","It is too long"],answer:1,exp:"핵심: 세부 사항 → 'February numbers were entered twice'. 이유: entered twice → duplicate entry(paraphrase)."},
{q:"The phrase \"caught off guard\" in paragraph 3 is closest in meaning to",choices:["blamed","delayed","surprised","praised"],answer:2,exp:"핵심: 관용 표현 → '불시에 당하다'. 이유: 대비 없이 질문을 받아 당황하는 상황이므로 surprised."}]},

{id:"p7-18", week:4, kind:"review", title:"Review: Negotiation Skills Workshop", text:"Workshop Review: \"Negotiation Skills for Managers\"\nPresented by Clearpath Training, October 3\nSubmitted by Arjun Mehta, Operations Manager\n\nI attended this one-day workshop with four colleagues from the procurement team. The instructor, Beatrice Lang, has clearly spent years negotiating supplier contracts, and her real-world examples were far more valuable than the textbook theory I expected. The role-playing exercises in the afternoon were the highlight; each participant negotiated a mock contract while the others gave feedback.\n\nTwo points for improvement: the morning session ran twenty minutes late because of a projector problem, and the printed workbook contained several pages that were never referenced. At $350 per person, the course is not cheap, but my team has already applied two of the techniques in a meeting with a vendor this week. I would recommend it to anyone who manages supplier relationships.", questions:[
{q:"What is suggested about Ms. Lang?",choices:["She works in the procurement department","She wrote the printed workbook","She teaches at a university","She has practical experience in her field"],answer:3,exp:"핵심: 추론 → 'spent years negotiating supplier contracts'. 이유: 수년간의 실무 → practical experience(paraphrase)."},
{q:"What is NOT mentioned as a drawback of the workshop?",choices:["A delayed start","Unused materials","The cost","The size of the group"],answer:3,exp:"핵심: NOT 문제 → 단점 두 가지 + 가격 언급 확인. 이유: 그룹 규모는 언급 없음."}]},

{id:"p7-19", week:4, kind:"schedule", title:"Schedule: Flight Itinerary", text:"Northwind Airlines — Flight NW 212\nBoston (BOS) to Denver (DEN)\nItinerary for: Ms. Chloe Dubois\nConfirmation Code: 7HRX2L\n\nDeparture: Thursday, May 21, 7:45 A.M. from Boston Logan, Terminal C, Gate C19\nArrival: Thursday, May 21, 10:20 A.M. at Denver International, Concourse B\nSeat: 14A (window, Economy Plus)\nBaggage: One checked bag included on both flights; additional bags $40 each\n\nReturn: Sunday, May 24, 3:10 P.M. from Denver, Concourse B\nArrival: Sunday, May 24, 9:05 P.M. at Boston, Terminal C\nSeat: 22C (aisle, Economy)\n\nNotes:\n- Boarding begins 40 minutes before departure and closes 15 minutes before departure.\n- A complimentary snack and beverage are served on all flights over three hours.\n- Changes made within 24 hours of departure are subject to a $75 fee.\n- Check in online at www.northwindair.example starting 24 hours before each flight.", questions:[
{q:"When does boarding close for the outbound flight?",choices:["7:05 A.M.","7:30 A.M.","7:45 A.M.","8:00 A.M."],answer:1,exp:"핵심: 계산 문제 → 출발 15분 전. 이유: 7:45에서 15분을 빼면 7:30."},
{q:"What is indicated about Ms. Dubois's seats?",choices:["She has the same seat on both flights","She chose an aisle seat for both flights","She upgraded her return seat","She is in a different cabin class on the return flight"],answer:3,exp:"핵심: 추론 → Economy Plus vs Economy 비교. 이유: 두 항공편의 좌석 등급이 다름."},
{q:"According to the notes, when can Ms. Dubois begin online check-in for her outbound flight?",choices:["Wednesday, May 20, at 7:45 A.M.","Thursday, May 21, at 7:05 A.M.","Monday, May 18","Only at the airport"],answer:0,exp:"핵심: 24시간 전 계산. 이유: 5월 21일 7:45의 24시간 전 → 5월 20일 7:45."}]},
